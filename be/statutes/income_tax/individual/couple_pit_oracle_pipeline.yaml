    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 articles 23, 51, and 89, spouse A net worker professional income supplied internally to the joint-assessment imputation stage
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_couple_spouse_a_remuneration_after_employee_social_security - belgium_pit_couple_spouse_a_article_51_forfait_professional_expenses)
  - name: belgium_pit_couple_spouse_a_article_289ter1_work_bonus_b_tax_credit_base_amount
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 289ter/1 and the encoded work-bonus formula, spouse A volet B credit base limited first by personal contributions due
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          min(belgium_pit_couple_spouse_a_work_bonus_b_before_cap, max(0, belgium_pit_couple_spouse_a_employee_social_security_contribution_before_reductions / belgium_worker_work_bonus_months_in_year)) * belgium_worker_work_bonus_months_in_year
  - name: belgium_pit_couple_spouse_a_article_289ter1_work_bonus_a_tax_credit_base_amount
