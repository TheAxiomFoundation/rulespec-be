    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 51 item 1 and cap paragraph, spouse A employee forfait on post-SSC remuneration
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          min(belgium_pit_couple_spouse_a_remuneration_after_employee_social_security * belgium_pit_article_51_employee_forfait_rate, belgium_pit_article_51_employee_and_business_profit_cap)
  - name: belgium_pit_spouse_a_professional_income_after_article_89_exclusions
