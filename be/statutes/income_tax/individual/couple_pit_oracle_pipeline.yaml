        formula: |-
          min(belgium_pit_couple_spouse_a_work_bonus_a_before_cap, max(0, belgium_pit_couple_spouse_a_employee_social_security_contribution_before_reductions / belgium_worker_work_bonus_months_in_year - belgium_pit_couple_spouse_a_work_bonus_b_before_cap)) * belgium_worker_work_bonus_months_in_year
  - name: belgium_pit_couple_spouse_a_article_289ter1_low_wage_work_bonus_credit
    kind: derived
    entity: TaxUnit
    dtype: Money
