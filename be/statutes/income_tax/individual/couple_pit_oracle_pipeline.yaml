    entity: TaxUnit
    dtype: Count
    period: Year
    source: CIR 1992 Article 132 ordinary dependent-child equivalent count, relation rollup after Articles 136 through 145 eligibility and disabled-child double counting
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          sum_where(belgium_pit_couple_dependent_of_tax_unit, belgium_pit_dependent_child_equivalent_count, belgium_pit_dependent_child_is_eligible_without_article_132bis)
  - name: belgium_pit_couple_article_132bis_shared_custody_child_count
    kind: derived
    entity: TaxUnit
    dtype: Count
    period: Year
    source: CIR 1992 Article 132bis shared-custody dependent-child equivalent count, relation rollup after the statutory conditions and disabled-child double counting
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          sum_where(belgium_pit_couple_dependent_of_tax_unit, belgium_pit_dependent_child_equivalent_count, belgium_pit_dependent_child_is_eligible_with_article_132bis)
  - name: belgium_pit_couple_children_under_3_without_childcare_reduction_count
    kind: derived
    entity: TaxUnit
    dtype: Count
    period: Year
    source: CIR 1992 Article 132 item 6 ordinary under-three child equivalent count after the childcare-reduction exclusion
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          sum_where(belgium_pit_couple_dependent_of_tax_unit, belgium_pit_dependent_child_equivalent_count, belgium_pit_dependent_child_is_eligible_for_under_3_supplement_without_article_132bis)
  - name: belgium_pit_couple_article_132bis_shared_custody_children_under_3_without_childcare_reduction_count
    kind: derived
    entity: TaxUnit
    dtype: Count
    period: Year
    source: CIR 1992 Articles 132 item 6 and 132bis shared-custody under-three child equivalent count after the childcare-reduction exclusion
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          sum_where(belgium_pit_couple_dependent_of_tax_unit, belgium_pit_dependent_child_equivalent_count, belgium_pit_dependent_child_is_eligible_for_under_3_supplement_with_article_132bis)
  - name: belgium_pit_couple_dependent_elderly_count
    kind: derived
    entity: TaxUnit
    dtype: Count
    period: Year
    source: CIR 1992 Article 132 item 7, relation rollup of certified elderly dependant counts
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          sum_where(belgium_pit_couple_dependent_of_tax_unit, belgium_pit_dependent_elderly_equivalent_count, belgium_pit_dependent_elderly_is_eligible_for_article_132_7)
  - name: belgium_pit_couple_other_dependent_count
    kind: derived
    entity: TaxUnit
    dtype: Count
    period: Year
    source: CIR 1992 Article 132 item 8, relation rollup of other dependant equivalents including disabled-person double counting
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          sum_where(belgium_pit_couple_dependent_of_tax_unit, belgium_pit_other_dependent_person_equivalent_count, belgium_pit_other_dependent_person_is_eligible)
  - name: belgium_pit_couple_article_132_child_ladder_tax_free_increase
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 Article 132 items 1 through 5, ordinary dependent-child ladder applied to the relation-backed equivalent count
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_couple_article_132_child_count <= 0:
              0
          else:
              if belgium_pit_couple_article_132_child_count == 1:
                  belgium_pit_one_child_tax_free_increase
              else:
                  if belgium_pit_couple_article_132_child_count == 2:
                      belgium_pit_two_children_tax_free_increase
                  else:
                      if belgium_pit_couple_article_132_child_count == 3:
                          belgium_pit_three_children_tax_free_increase
                      else:
                          belgium_pit_four_children_tax_free_increase + max(0, belgium_pit_couple_article_132_child_count - belgium_pit_article_132_first_additional_child_count) * belgium_pit_additional_child_after_four_tax_free_increase
  - name: belgium_pit_couple_article_132bis_shared_child_ladder_before_half_share
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 Article 132bis, shared children determined separately from other household children before the half allocation
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_couple_article_132bis_shared_custody_child_count <= 0:
              0
          else:
              if belgium_pit_couple_article_132bis_shared_custody_child_count == 1:
                  belgium_pit_one_child_tax_free_increase
              else:
                  if belgium_pit_couple_article_132bis_shared_custody_child_count == 2:
                      belgium_pit_two_children_tax_free_increase
                  else:
                      if belgium_pit_couple_article_132bis_shared_custody_child_count == 3:
                          belgium_pit_three_children_tax_free_increase
                      else:
                          belgium_pit_four_children_tax_free_increase + max(0, belgium_pit_couple_article_132bis_shared_custody_child_count - belgium_pit_article_132_first_additional_child_count) * belgium_pit_additional_child_after_four_tax_free_increase
  - name: belgium_pit_joint_article_132_supplements_tax_free_amount
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 Articles 132 and 132bis, ordinary child supplements plus one half of separately determined shared-custody child supplements
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_couple_article_132_child_ladder_tax_free_increase + belgium_pit_child_under_3_tax_free_increase * belgium_pit_couple_children_under_3_without_childcare_reduction_count + belgium_pit_article_134_shared_custody_child_tax_credit_multiplier * (belgium_pit_couple_article_132bis_shared_child_ladder_before_half_share + belgium_pit_child_under_3_tax_free_increase * belgium_pit_couple_article_132bis_shared_custody_children_under_3_without_childcare_reduction_count) + belgium_pit_dependent_elderly_tax_free_increase * belgium_pit_couple_dependent_elderly_count + belgium_pit_other_dependent_tax_free_increase * belgium_pit_couple_other_dependent_count
  - name: belgium_pit_couple_spouse_a_article_130_base_tax
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 130, spouse A post-imputation taxable income through the ordinary rate scale
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_couple_spouse_a_taxable_income <= belgium_pit_article_130_first_bracket_upper_threshold:
              belgium_pit_couple_spouse_a_taxable_income * belgium_pit_article_130_first_bracket_rate
          else:
              if belgium_pit_couple_spouse_a_taxable_income <= belgium_pit_article_130_second_bracket_upper_threshold:
                  belgium_pit_article_130_first_bracket_upper_threshold * belgium_pit_article_130_first_bracket_rate + (belgium_pit_couple_spouse_a_taxable_income - belgium_pit_article_130_first_bracket_upper_threshold) * belgium_pit_article_130_second_bracket_rate
              else:
                  if belgium_pit_couple_spouse_a_taxable_income <= belgium_pit_article_130_third_bracket_upper_threshold:
                      belgium_pit_article_130_first_bracket_upper_threshold * belgium_pit_article_130_first_bracket_rate + (belgium_pit_article_130_second_bracket_upper_threshold - belgium_pit_article_130_first_bracket_upper_threshold) * belgium_pit_article_130_second_bracket_rate + (belgium_pit_couple_spouse_a_taxable_income - belgium_pit_article_130_second_bracket_upper_threshold) * belgium_pit_article_130_third_bracket_rate
                  else:
                      belgium_pit_article_130_first_bracket_upper_threshold * belgium_pit_article_130_first_bracket_rate + (belgium_pit_article_130_second_bracket_upper_threshold - belgium_pit_article_130_first_bracket_upper_threshold) * belgium_pit_article_130_second_bracket_rate + (belgium_pit_article_130_third_bracket_upper_threshold - belgium_pit_article_130_second_bracket_upper_threshold) * belgium_pit_article_130_third_bracket_rate + (belgium_pit_couple_spouse_a_taxable_income - belgium_pit_article_130_third_bracket_upper_threshold) * belgium_pit_article_130_top_bracket_rate
  - name: belgium_pit_couple_spouse_b_article_130_base_tax
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 130, spouse B post-imputation taxable income through the ordinary rate scale
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_couple_spouse_b_taxable_income <= belgium_pit_article_130_first_bracket_upper_threshold:
              belgium_pit_couple_spouse_b_taxable_income * belgium_pit_article_130_first_bracket_rate
          else:
              if belgium_pit_couple_spouse_b_taxable_income <= belgium_pit_article_130_second_bracket_upper_threshold:
                  belgium_pit_article_130_first_bracket_upper_threshold * belgium_pit_article_130_first_bracket_rate + (belgium_pit_couple_spouse_b_taxable_income - belgium_pit_article_130_first_bracket_upper_threshold) * belgium_pit_article_130_second_bracket_rate
              else:
                  if belgium_pit_couple_spouse_b_taxable_income <= belgium_pit_article_130_third_bracket_upper_threshold:
