      predicate: belgium_pit_couple_spouse_of_tax_unit
      arity: 2
      arguments: [TaxUnit, Person]
    source: CIR 1992 articles 126 and 87/88, spouses whose Person-scoped worker results feed the joint TaxUnit assessment
  - name: belgium_pit_couple_dependent_of_tax_unit
    kind: data_relation
    data_relation:
      predicate: belgium_pit_couple_dependent_of_tax_unit
      arity: 2
      arguments: [TaxUnit, Person]
    source: CIR 1992 articles 132 and 136 through 145, related potential dependant Person records whose eligibility results feed the joint TaxUnit assessment
  - name: belgium_pit_spouse_a_professional_income_after_article_89_exclusions
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 articles 23, 51, and 89, relation rollup of the Person-scoped worker net professional income assigned to spouse A
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          sum_where(belgium_pit_couple_spouse_of_tax_unit, belgium_pit_pilot_worker_net_professional_income, belgium_pit_couple_worker_is_spouse_a)
  - name: belgium_pit_spouse_b_professional_income_after_article_89_exclusions
