module:
  summary: |-
    This composed pilot module exposes a tax-unit-level path from two spouses'
    gross worker remunerations into joint-assessment Belgian PIT for the
    EUROMOD oracle slice. For each spouse it mirrors the verified worker pilot's
    Article 38 employee social-security contribution and work-bonus mechanics,
    post-contribution remuneration, Article 51 employee forfait, net Article 89
    professional-income surface, and refundable Article 289ter/1 work-bonus
    credit. It then wires the encoded Article 87/88 spouse professional-income
    imputation from
    joint_assessment.yaml (single-earner 30-percent imputation capped at
    13,460 euros indexed, and low-earner imputation up to a 30-percent joint
    target) into a per-spouse application of the Article 130 rate scale, the
    Article 131 base tax-free amount, the Article 134 paragraph 4 cross-spouse
    tax-free-amount allocation and tax reduction, and the special-financing-law
    Article 5/2 autonomy factor,
    each computed separately on that partner's own post-imputation
    professional income exactly as CIR 1992 requires under joint assessment,
    then summed into one tax-unit federal-and-local tax total comparable to
    the EUROMOD
    BE_2025 tin_s national-plus-communal aggregate. It deliberately keeps
    existing public rule ids in joint_assessment.yaml, rate_scale.yaml,
    tax_free_amount.yaml, tax_free_amount_tax.yaml, and communal_additions.yaml
    unchanged, imports their grounded worker-rate, work-bonus, forfait, credit,
    and joint tax-free-allocation concepts, and defines the Article 5/2
    autonomy factor and reduced-State-tax share locally (identical values and
    proofs to the worker pilot, kept local to avoid a pipeline-to-pipeline
    import cycle). It excludes dependants and Article 132 supplements, the
    assisting-spouse Article 86 attribution, the
    Article 129 loss-balance imputation, other income categories, actual-
    expense proof, replacement-income reductions, regional reductions/
    credits other than Article 289ter/1, professional withholding tables,
    treaty allocation, and partial-year cases. The worker stages retain the
    same full-year equal-month and supplied-reference-remuneration boundaries
    as the worker pilot.
  source_verification:
    corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-53"
rules:
  - name: belgium_pit_couple_article_5_2_autonomy_factor
    kind: parameter
    dtype: Rate
    source: Special financing law article 5/2 and 19 December 2017 royal decree article 1, definitive autonomy factor applicable to income taxes from assessment year 2018
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: be/regulation/arrete/2017/12/19/2017032216/article/1er
              excerpt: "Le facteur d'autonomie définitif visé à l'article 5/2, § 1er, alinéas 3 et 4, de la loi spéciale du 16 janvier 1989 relative au financement des Communautés et des Régions, est, sur la base des rapports de la Cour des comptes visés à l'article 81ter de la même loi spéciale, déterminé à 24,957 %."
    versions:
      - effective_from: '2018-01-01'
        formula: |-
          0.24957
  - name: belgium_pit_couple_article_5_2_state_tax_share_after_autonomy_factor
    kind: parameter
    dtype: Rate
    source: Special financing law article 5/2 defines reduced State tax as State tax less State tax multiplied by the autonomy factor
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: be/statute/loi/1989/01/16/1989021010/article/5-2
              excerpt: "L'impôt Etat réduit est l'impôt Etat diminué d'un montant égal à l'impôt Etat multiplié par le facteur d'autonomie."
    versions:
      - effective_from: '2018-01-01'
        formula: |-
          1 - belgium_pit_couple_article_5_2_autonomy_factor
  - name: belgium_pit_couple_spouse_a_employee_social_security_contribution_base
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: 1969 workers social-security law and 28 November 1969 implementing royal decree, spouse A worker contribution-base bridge
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_couple_spouse_a_gross_worker_remuneration
  - name: belgium_pit_couple_spouse_a_employee_social_security_contribution_before_reductions
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Law of 29 June 1981 article 38 section 2, spouse A ordinary worker contribution before reductions
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_couple_spouse_a_employee_social_security_contribution_base * belgium_article_38_section_2_ordinary_worker_total_contribution_rate
  - name: belgium_pit_couple_spouse_a_work_bonus_reference_annual_remuneration
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Royal Decree of 17 January 2000 article 1, spouse A supplied-reference or contribution-base annual remuneration bridge
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_couple_spouse_a_supplied_work_bonus_reference_annual_remuneration > 0:
              belgium_pit_couple_spouse_a_supplied_work_bonus_reference_annual_remuneration
          else:
              max(0, belgium_pit_couple_spouse_a_employee_social_security_contribution_base)
  - name: belgium_pit_couple_spouse_a_work_bonus_monthly_remuneration
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Royal Decree of 17 January 2000 article 1, spouse A full-year equal-month remuneration bridge
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_couple_spouse_a_work_bonus_reference_annual_remuneration / belgium_worker_work_bonus_months_in_year
  - name: belgium_pit_couple_spouse_a_work_bonus_monthly_contribution_before_reduction
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Royal Decree of 17 January 2000 article 1 section 4, spouse A monthly personal-contribution cap
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_couple_spouse_a_employee_social_security_contribution_before_reductions / belgium_worker_work_bonus_months_in_year)
  - name: belgium_pit_couple_spouse_a_work_bonus_a_before_cap
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Imported ONSS February-to-December 2025 work-bonus table, spouse A volet A before the personal-contribution cap
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_couple_spouse_a_work_bonus_monthly_remuneration <= belgium_worker_work_bonus_s1bis_threshold:
              belgium_worker_work_bonus_a_monthly_maximum
          else:
              if belgium_pit_couple_spouse_a_work_bonus_monthly_remuneration <= belgium_worker_work_bonus_s2_threshold:
                  max(0, floor(((belgium_worker_work_bonus_a_monthly_maximum - belgium_worker_work_bonus_alpha_a * (belgium_pit_couple_spouse_a_work_bonus_monthly_remuneration - belgium_worker_work_bonus_s1bis_threshold)) / belgium_worker_work_bonus_cent_rounding_multiple) + 0.5) * belgium_worker_work_bonus_cent_rounding_multiple)
              else:
                  0
  - name: belgium_pit_couple_spouse_a_work_bonus_b_before_cap
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Imported ONSS February-to-December 2025 work-bonus table, spouse A volet B before the personal-contribution cap
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_couple_spouse_a_work_bonus_monthly_remuneration <= belgium_worker_work_bonus_s1_threshold:
              belgium_worker_work_bonus_b_monthly_maximum
          else:
              if belgium_pit_couple_spouse_a_work_bonus_monthly_remuneration <= belgium_worker_work_bonus_s1bis_threshold:
                  max(0, floor(((belgium_worker_work_bonus_b_monthly_maximum - belgium_worker_work_bonus_alpha_b * (belgium_pit_couple_spouse_a_work_bonus_monthly_remuneration - belgium_worker_work_bonus_s1_threshold)) / belgium_worker_work_bonus_cent_rounding_multiple) + 0.5) * belgium_worker_work_bonus_cent_rounding_multiple)
              else:
                  0
  - name: belgium_pit_couple_spouse_a_work_bonus_january_2025_a_before_cap
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Imported ONSS January 2025 work-bonus table, spouse A volet A before the personal-contribution cap
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_couple_spouse_a_work_bonus_monthly_remuneration <= belgium_worker_work_bonus_january_2025_s1bis_threshold:
              belgium_worker_work_bonus_january_2025_a_monthly_maximum
          else:
              if belgium_pit_couple_spouse_a_work_bonus_monthly_remuneration <= belgium_worker_work_bonus_january_2025_s2_threshold:
                  max(0, floor(((belgium_worker_work_bonus_january_2025_a_monthly_maximum - belgium_worker_work_bonus_january_2025_alpha_a * (belgium_pit_couple_spouse_a_work_bonus_monthly_remuneration - belgium_worker_work_bonus_january_2025_s1bis_threshold)) / belgium_worker_work_bonus_cent_rounding_multiple) + 0.5) * belgium_worker_work_bonus_cent_rounding_multiple)
              else:
                  0
  - name: belgium_pit_couple_spouse_a_work_bonus_january_2025_b_before_cap
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Imported ONSS January 2025 work-bonus table, spouse A volet B before the personal-contribution cap
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_couple_spouse_a_work_bonus_monthly_remuneration <= belgium_worker_work_bonus_january_2025_s1_threshold:
              belgium_worker_work_bonus_january_2025_b_monthly_maximum
          else:
              if belgium_pit_couple_spouse_a_work_bonus_monthly_remuneration <= belgium_worker_work_bonus_january_2025_s1bis_threshold:
                  max(0, floor(((belgium_worker_work_bonus_january_2025_b_monthly_maximum - belgium_worker_work_bonus_january_2025_alpha_b * (belgium_pit_couple_spouse_a_work_bonus_monthly_remuneration - belgium_worker_work_bonus_january_2025_s1_threshold)) / belgium_worker_work_bonus_cent_rounding_multiple) + 0.5) * belgium_worker_work_bonus_cent_rounding_multiple)
              else:
                  0
  - name: belgium_pit_couple_spouse_a_work_bonus_january_2025_b_amount
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Royal Decree of 17 January 2000 article 1 section 4, spouse A January volet B limited first by personal contributions due
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          min(belgium_pit_couple_spouse_a_work_bonus_january_2025_b_before_cap, belgium_pit_couple_spouse_a_work_bonus_monthly_contribution_before_reduction) * belgium_worker_work_bonus_january_2025_months_in_year
  - name: belgium_pit_couple_spouse_a_work_bonus_january_2025_a_amount
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Royal Decree of 17 January 2000 article 1 section 4, spouse A January volet A limited after volet B by personal contributions due
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          min(belgium_pit_couple_spouse_a_work_bonus_january_2025_a_before_cap, max(0, belgium_pit_couple_spouse_a_work_bonus_monthly_contribution_before_reduction - belgium_pit_couple_spouse_a_work_bonus_january_2025_b_amount / belgium_worker_work_bonus_january_2025_months_in_year)) * belgium_worker_work_bonus_january_2025_months_in_year
  - name: belgium_pit_couple_spouse_a_work_bonus_february_to_december_2025_b_amount
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Royal Decree of 17 January 2000 article 1 section 4, spouse A February-to-December volet B limited first by personal contributions due
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          min(belgium_pit_couple_spouse_a_work_bonus_b_before_cap, belgium_pit_couple_spouse_a_work_bonus_monthly_contribution_before_reduction) * belgium_worker_work_bonus_february_to_december_2025_months_in_year
  - name: belgium_pit_couple_spouse_a_work_bonus_february_to_december_2025_a_amount
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Royal Decree of 17 January 2000 article 1 section 4, spouse A February-to-December volet A limited after volet B by personal contributions due
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          min(belgium_pit_couple_spouse_a_work_bonus_a_before_cap, max(0, belgium_pit_couple_spouse_a_work_bonus_monthly_contribution_before_reduction - belgium_pit_couple_spouse_a_work_bonus_b_before_cap)) * belgium_worker_work_bonus_february_to_december_2025_months_in_year
  - name: belgium_pit_couple_spouse_a_work_bonus_a_amount
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Encoded ONSS 2025 full-year equal-month work-bonus reduction, spouse A volet A actually granted for social-security contribution settlement
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_couple_spouse_a_work_bonus_january_2025_a_amount + belgium_pit_couple_spouse_a_work_bonus_february_to_december_2025_a_amount
  - name: belgium_pit_couple_spouse_a_work_bonus_b_amount
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Encoded ONSS 2025 full-year equal-month work-bonus reduction, spouse A volet B actually granted for social-security contribution settlement
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_couple_spouse_a_work_bonus_january_2025_b_amount + belgium_pit_couple_spouse_a_work_bonus_february_to_december_2025_b_amount
  - name: belgium_pit_couple_spouse_a_employee_social_security_work_bonus_reduction
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Encoded ONSS 2025 full-year equal-month work bonus, spouse A total worker-side Article 38 reduction
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          min(max(0, belgium_pit_couple_spouse_a_employee_social_security_contribution_before_reductions), max(0, belgium_pit_couple_spouse_a_work_bonus_a_amount + belgium_pit_couple_spouse_a_work_bonus_b_amount))
  - name: belgium_pit_couple_spouse_a_employee_social_security_ordinary_worker_contribution
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: Law of 29 June 1981 article 38, spouse A ordinary worker contribution after the encoded work-bonus reduction
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_couple_spouse_a_employee_social_security_contribution_before_reductions - belgium_pit_couple_spouse_a_employee_social_security_work_bonus_reduction)
  - name: belgium_pit_couple_spouse_a_remuneration_after_employee_social_security
    kind: derived
    entity: TaxUnit
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 23 paragraph 2, spouse A worker remuneration after ordinary employee social-security contribution
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_couple_spouse_a_gross_worker_remuneration - belgium_pit_couple_spouse_a_employee_social_security_ordinary_worker_contribution)
  - name: belgium_pit_couple_spouse_a_article_51_forfait_professional_expenses
