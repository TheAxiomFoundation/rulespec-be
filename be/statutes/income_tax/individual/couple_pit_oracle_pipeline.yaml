module:
  summary: |-
    This composed pilot module exposes a relation-backed path from two Person
    worker records into TaxUnit-level joint-assessment Belgian PIT for the
    EUROMOD oracle slice. It imports the verified worker pilot's Person-scoped
    Article 38 employee social-security contribution and work-bonus mechanics,
    post-contribution remuneration, Article 51 employee forfait, net Article 89
    professional-income surface, and refundable Article 289ter/1 work-bonus
    credit. Explicit spouse-role facts select the two Person results through a
    spouse-of-tax-unit relation before the TaxUnit wires the encoded Article
    87/88 professional-income imputation from
    joint_assessment.yaml (single-earner 30-percent imputation capped at
    13,460 euros indexed, and low-earner imputation up to a 30-percent joint
    target) into a per-spouse application of the Article 130 rate scale, the
    Article 131 base tax-free amount, the Article 134 paragraph 4 cross-spouse
    tax-free-amount allocation and tax reduction, and the special-financing-law
    Article 5/2 autonomy factor,
    each computed separately on that partner's own post-imputation
    professional income exactly as CIR 1992 requires under joint assessment,
    then summed into one tax-unit federal-and-local tax total comparable to
    the EUROMOD
    BE_2025 tin_s national-plus-communal aggregate. It deliberately keeps
    existing public rule ids in joint_assessment.yaml, rate_scale.yaml,
    tax_free_amount.yaml, tax_free_amount_tax.yaml, and communal_additions.yaml
    unchanged, imports the worker pilot's grounded Person results and
    Article 5/2 reduced-State-tax share together with the joint
    tax-free-allocation concepts. A second TaxUnit-to-Person relation accepts
    potential dependant records, applies the encoded Articles 136 through 145
    eligibility and resource conditions at Person scope, and rolls ordinary
    and Article 132bis shared-custody child equivalents (including disabled-
    child double counting), under-three children, certified elderly dependants,
    and other dependant equivalents into the Article 132 supplements before
    the paragraph 4 spouse allocation. The unused tax value attributable to
    child supplements is then capped jointly under paragraph 3 and subtracted
    as a refundable credit. It excludes the assisting-spouse Article 86
    attribution, the
    Article 129 loss-balance imputation, other income categories, actual-
    expense proof, replacement-income reductions, regional reductions/
    credits other than Article 289ter/1, professional withholding tables,
    treaty allocation, and partial-year cases. The related Person records retain
    the worker pilot's full-year equal-month and supplied-reference-remuneration
    boundaries.
