  - name: belgium_pit_pilot_shared_custody_child_ladder_tax_free_amount
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 132bis, half of the Article 132 child ladder determined separately from other household children
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_article_132bis_shared_custody_child_count <= 0:
              0
          else:
              if belgium_pit_article_132bis_shared_custody_child_count == 1:
                  belgium_pit_one_child_tax_free_increase * belgium_pit_article_134_shared_custody_child_tax_credit_multiplier
              else:
                  if belgium_pit_article_132bis_shared_custody_child_count == 2:
                      belgium_pit_two_children_tax_free_increase * belgium_pit_article_134_shared_custody_child_tax_credit_multiplier
                  else:
                      if belgium_pit_article_132bis_shared_custody_child_count == 3:
                          belgium_pit_three_children_tax_free_increase * belgium_pit_article_134_shared_custody_child_tax_credit_multiplier
                      else:
                          (belgium_pit_four_children_tax_free_increase + max(0, belgium_pit_article_132bis_shared_custody_child_count - belgium_pit_article_132_first_additional_child_count) * belgium_pit_additional_child_after_four_tax_free_increase) * belgium_pit_article_134_shared_custody_child_tax_credit_multiplier
