module:
  summary: |-
    This composed pilot module exposes a dense-engine-friendly Person-level
    path from gross worker remuneration into Belgian PIT for the EUROMOD oracle
    slice. It wires the ordinary Article 38 employee social-security
    contribution, Article 51 employee forfait, Article 6 taxable-income concept,
    Article 130 rate scale, Article 131 base tax-free amount, Article 134
    tax-free-amount reduction, the special-financing-law Article 5/2 autonomy
    factor, Article 289ter/1 work-bonus credit from the encoded ONSS 2025
    full-year equal-month work-bonus A/B amounts capped by contributions due,
    and supplied Article 465/468 local additions into one module. Related
    Person records now supply the Articles 132 and 136 through 145 dependant
    ledger, Article 132bis half-shares, the Article 133 isolated-parent
    supplements, and the Article 134 paragraph 3 refundable credits. It
    deliberately keeps existing public rule ids in other modules unchanged and
    excludes joint assessment, other
    income categories, actual-expense proof, replacement-income reductions,
    regional reductions/credits, professional withholding tables, ONSS work-
    bonus partial-year and part-time mechanics, treaty allocation, and
    partial-year cases.
  source_verification:
    corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-53
