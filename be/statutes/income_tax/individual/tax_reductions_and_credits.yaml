          belgium_pit_article_289ter1_work_bonus_credit_ceiling_after_article_178
      else:
          floor(((belgium_pit_article_289ter1_work_bonus_credit_ceiling_after_article_178 * belgium_pit_article_289ter1_article_174_1_counted_months / belgium_pit_article_174_1_months_in_full_calendar_year) / belgium_pit_article_178_nearest_ten_rounding_multiple) + belgium_pit_article_178_half_up_rounding_increment) * belgium_pit_article_178_nearest_ten_rounding_multiple
