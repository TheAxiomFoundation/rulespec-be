- name: belgium_pit_article_289ter1_work_bonus_credit_ceiling_indexation_coefficient
  kind: derived
  entity: Person
  dtype: Decimal
  period: Year
  source: CIR 1992 article 178 section 3 default coefficient, calculated from explicit CPI-average inputs for Article 289ter/1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-279
          excerpt: "2° pour les exercices d'imposition 2000 et suivants, au moyen du coefficient qui est obtenu en divisant la moyenne des indices des prix de l'année qui précède celle des revenus par la moyenne des indices des prix de l'année 1988 multipliée par le rapport entre les moyennes des indices des prix des années 1997 et 1991."
  versions:
  - effective_from: '2026-01-01'
    formula: |-
      floor(((floor(belgium_pit_article_178_prior_income_year_average_consumer_price_index * belgium_pit_article_178_hundredth_rounding_scale + belgium_pit_article_178_half_up_rounding_increment) / belgium_pit_article_178_hundredth_rounding_scale) / ((floor(belgium_pit_article_178_1988_average_consumer_price_index * belgium_pit_article_178_hundredth_rounding_scale + belgium_pit_article_178_half_up_rounding_increment) / belgium_pit_article_178_hundredth_rounding_scale) * ((floor(belgium_pit_article_178_1997_average_consumer_price_index * belgium_pit_article_178_hundredth_rounding_scale + belgium_pit_article_178_half_up_rounding_increment) / belgium_pit_article_178_hundredth_rounding_scale) / (floor(belgium_pit_article_178_1991_average_consumer_price_index * belgium_pit_article_178_hundredth_rounding_scale + belgium_pit_article_178_half_up_rounding_increment) / belgium_pit_article_178_hundredth_rounding_scale)))) * belgium_pit_article_178_ten_thousandth_rounding_scale + belgium_pit_article_178_half_up_rounding_increment) / belgium_pit_article_178_ten_thousandth_rounding_scale
