        source:
          corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-279
          excerpt: "Après application du coefficient, les montants sont, à l'exception de ceux mentionnés aux articles 21, alinéa 1er, 14°, 66bis, alinéa 3, 14535, alinéa 6, du montant de l'indemnité kilométrique visé à l'article 38, § 1er, alinéa 1er, 14°, a, et des montants des réductions visés à l'article 147, arrondis au multiple de 10 euros supérieur ou inférieur selon que le chiffre des unités atteint ou non 5."
  versions:
  - effective_from: '2025-01-01'
    formula: '1540'
  - effective_from: '2026-01-01'
    formula: |-
      floor((belgium_pit_article_289ter1_work_bonus_credit_ceiling_statutory_amount * belgium_pit_article_289ter1_work_bonus_credit_ceiling_indexation_coefficient / belgium_pit_article_178_nearest_ten_rounding_multiple) + belgium_pit_article_178_half_up_rounding_increment) * belgium_pit_article_178_nearest_ten_rounding_multiple
- name: belgium_pit_article_289ter1_work_bonus_credit_ceiling
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: EUR
  source: CIR 1992 articles 174/1, 178, and 289ter/1, applied fiscal work-bonus credit ceiling after taxable-period proration
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-515
          excerpt: "Les dispositions des articles 174/1 et 178, § 3, alinéa 1er, 2°, sont applicables à ce montant."
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-277
          excerpt: "Lorsque la période imposable ne correspond pas à une année civile complète pour une cause autre que le décès"
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-277
          excerpt: "Pour déterminer la durée de la période imposable exprimée en mois, chaque mois civil dont le quinzième jour appartient à la période imposable, est pris en compte comme un mois entier."
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-277
          excerpt: "Les montants réduits conformément à l'alinéa 1er sont arrondis au multiple de 10 euros supérieur ou inférieur selon que le chiffre des unités atteint ou non 5."
