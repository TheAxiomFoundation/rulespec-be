    formula: "if belgium_pit_article_147_net_income_for_replacement_reduction <= 0:\n\
      \    0\nelse:\n    min(1, belgium_pit_article_147_unemployment_income / belgium_pit_article_147_net_income_for_replacement_reduction)\
      \ * (belgium_pit_article_147_basic_replacement_reduction + belgium_pit_article_147_additional_replacement_reduction)"
- name: belgium_pit_article_147_sickness_invalidity_reduction_before_phaseouts
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: EUR
  source: CIR 1992 article 147 items 9 and 10, sickness and invalidity indemnity reduction
    before phaseouts
  versions:
  - effective_from: '2025-01-01'
    formula: "if belgium_pit_article_147_net_income_for_replacement_reduction <= 0:\n\
      \    0\nelse:\n    min(1, belgium_pit_article_147_sickness_invalidity_income\
      \ / belgium_pit_article_147_net_income_for_replacement_reduction) * belgium_pit_article_147_sickness_invalidity_reduction"
- name: belgium_pit_article_151_unemployment_reduction_factor
  kind: derived
  entity: Person
  dtype: Rate
  period: Year
  source: CIR 1992 article 151, unemployment reduction phaseout factor
  versions:
  - effective_from: '2025-01-01'
    formula: "if belgium_pit_article_151_older_unemployed_with_seniority_supplement:\n\
      \    1\nelse:\n    if belgium_pit_taxable_income >= belgium_pit_article_151_unemployment_phaseout_end:\n\
      \        0\n    else:\n        if belgium_pit_taxable_income <= belgium_pit_article_151_unemployment_phaseout_start:\n\
      \            1\n        else:\n            (belgium_pit_article_151_unemployment_phaseout_end\
      \ - belgium_pit_taxable_income) / (belgium_pit_article_151_unemployment_phaseout_end\
      \ - belgium_pit_article_151_unemployment_phaseout_start)"
- name: belgium_pit_article_1511_additional_reduction_factor
  kind: derived
  entity: Person
  dtype: Rate
  period: Year
  source: CIR 1992 article 151/1, additional replacement-income reduction phaseout
    factor
  versions:
  - effective_from: '2025-01-01'
    formula: "if belgium_pit_taxable_income >= belgium_pit_article_1511_additional_phaseout_end:\n\
      \    0\nelse:\n    if belgium_pit_taxable_income <= belgium_pit_article_1511_additional_phaseout_start:\n\
      \        1\n    else:\n        (belgium_pit_article_1511_additional_phaseout_end\
      \ - belgium_pit_taxable_income) / (belgium_pit_article_1511_additional_phaseout_end\
      \ - belgium_pit_article_1511_additional_phaseout_start)"
- name: belgium_pit_article_152_replacement_reduction_factor
  kind: derived
  entity: Person
  dtype: Rate
  period: Year
  source: CIR 1992 article 152, phaseout factor for replacement-income reductions
    not covered by Articles 151 and 151/1
  versions:
  - effective_from: '2025-01-01'
    formula: "if belgium_pit_taxable_income >= belgium_pit_article_152_replacement_phaseout_end:\n\
      \    1 / 3\nelse:\n    if belgium_pit_taxable_income <= belgium_pit_article_152_replacement_phaseout_start:\n\
      \        1\n    else:\n        1 / 3 + (2 / 3) * ((belgium_pit_article_152_replacement_phaseout_end\
      \ - belgium_pit_taxable_income) / (belgium_pit_article_152_replacement_phaseout_end\
      \ - belgium_pit_article_152_replacement_phaseout_start))"
- name: belgium_pit_selected_replacement_income_reduction_after_phaseouts
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: EUR
  source: CIR 1992 articles 147, 151, 151/1, and 152, selected replacement-income
    reduction after statutory phaseout interfaces
  versions:
  - effective_from: '2025-01-01'
    formula: belgium_pit_article_147_pension_and_other_replacement_reduction_before_phaseouts
      * belgium_pit_article_152_replacement_reduction_factor + belgium_pit_article_147_unemployment_reduction_before_phaseouts
      * belgium_pit_article_151_unemployment_reduction_factor + belgium_pit_article_147_sickness_invalidity_reduction_before_phaseouts
      * belgium_pit_article_152_replacement_reduction_factor
- name: belgium_pit_article_289bis_self_employed_investment_credit
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: EUR
  source: CIR 1992 article 289bis, self-employed investment credit
  versions:
  - effective_from: '2025-01-01'
    formula: "if belgium_pit_article_289bis_self_employed_credit_conditions_met:\n\
      \    min(max(0, belgium_pit_article_289bis_current_qualifying_net_business_assets\
      \ - belgium_pit_article_289bis_prior_three_year_max_qualifying_net_business_assets)\
      \ * belgium_pit_article_289bis_self_employed_investment_credit_rate, belgium_pit_article_289bis_self_employed_investment_credit_ceiling)\n\
      else:\n    0"
- name: belgium_pit_article_289ter_max_credit_amount
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: EUR
  source: CIR 1992 article 289ter, low activity-income credit maximum by taxpayer
    status
  versions:
  - effective_from: '2025-01-01'
    formula: "if belgium_pit_article_289ter_is_assisting_spouse:\n    belgium_pit_article_289ter_assisting_spouse_credit\n\
      else:\n    if belgium_pit_article_289ter_is_covered_public_worker_without_contract:\n\
      \        belgium_pit_article_289ter_public_worker_credit\n    else:\n      \
      \  belgium_pit_article_289ter_standard_credit"
- name: belgium_pit_article_289ter_credit_by_activity_income_before_professional_ratio
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: EUR
  source: CIR 1992 article 289ter paragraph 2, low activity-income credit by activity-income
    band
  versions:
  - effective_from: '2025-01-01'
    formula: |-
      max(0, min(
          belgium_pit_article_289ter_max_credit_amount,
          belgium_pit_article_289ter_max_credit_amount * max(0, belgium_pit_article_289ter_activity_income - belgium_pit_article_289ter_activity_income_lower_threshold) / (belgium_pit_article_289ter_activity_income_plateau_start - belgium_pit_article_289ter_activity_income_lower_threshold),
          belgium_pit_article_289ter_max_credit_amount * max(0, belgium_pit_article_289ter_activity_income_upper_threshold - belgium_pit_article_289ter_activity_income) / (belgium_pit_article_289ter_activity_income_upper_threshold - belgium_pit_article_289ter_activity_income_plateau_end)
      ))
- name: belgium_pit_article_289ter_professional_income_ratio
  kind: derived
  entity: Person
  dtype: Rate
  period: Year
  source: CIR 1992 article 289ter paragraph 2, reduction where activity income is
    only part of net professional income
  versions:
  - effective_from: '2025-01-01'
    formula: "if belgium_pit_article_289ter_net_professional_income <= 0:\n    0\n\
      else:\n    min(1, belgium_pit_article_289ter_activity_income / belgium_pit_article_289ter_net_professional_income)"
- name: belgium_pit_article_289ter_total_net_income_cap
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: EUR
  source: CIR 1992 article 289ter paragraph 2, total net income cap on low activity-income
    credit
  versions:
  - effective_from: '2025-01-01'
    formula: "if belgium_pit_article_289ter_total_net_income <= belgium_pit_article_289ter_activity_income_plateau_end:\n\
      \    belgium_pit_article_289ter_max_credit_amount\nelse:\n    if belgium_pit_article_289ter_total_net_income\
      \ <= belgium_pit_article_289ter_activity_income_upper_threshold:\n        belgium_pit_article_289ter_max_credit_amount\
      \ * ((belgium_pit_article_289ter_activity_income_upper_threshold - belgium_pit_article_289ter_total_net_income)\
      \ / (belgium_pit_article_289ter_activity_income_upper_threshold - belgium_pit_article_289ter_activity_income_plateau_end))\n\
      \    else:\n        0"
- name: belgium_pit_article_289ter_low_activity_income_credit
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: EUR
  source: CIR 1992 article 289ter, low activity-income credit
  versions:
  - effective_from: '2025-01-01'
    formula: |-
      if belgium_pit_article_289ter_low_activity_credit_conditions_met:
          max(0, min(
              max(0, belgium_pit_article_289ter_credit_by_activity_income_before_professional_ratio) * max(0, belgium_pit_article_289ter_professional_income_ratio),
              max(0, belgium_pit_article_289ter_total_net_income_cap)
          ))
      else:
          0
- name: belgium_pit_article_289ter1_low_wage_work_bonus_credit
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: EUR
  source: CIR 1992 article 289ter/1, low-wage work-bonus credit
  versions:
  - effective_from: '2025-01-01'
    formula: "if belgium_pit_article_289ter1_work_bonus_credit_conditions_met:\n \
      \   min(belgium_pit_article_289ter1_work_bonus_a_amount * belgium_pit_article_289ter1_work_bonus_a_rate\
      \ + belgium_pit_article_289ter1_work_bonus_b_amount * belgium_pit_article_289ter1_work_bonus_b_rate,\
      \ belgium_pit_article_289ter1_work_bonus_credit_ceiling)\nelse:\n    0"
- name: belgium_pit_selected_personal_credits
  kind: derived
  entity: Person
  dtype: Money
  period: Year
  unit: EUR
  source: Structural bridge summing selected CIR 1992 personal credits encoded in
    this module
  versions:
  - effective_from: '2025-01-01'
    formula: belgium_pit_article_289bis_self_employed_investment_credit + belgium_pit_article_289ter_low_activity_income_credit
      + belgium_pit_article_289ter1_low_wage_work_bonus_credit
