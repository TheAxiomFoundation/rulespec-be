# Provenance: Moniteur belge 29 July 2026, pp. 40196-40197, 40218, and 40219-40220; pinned PDF SHA-256 033bfdecb456d5b901bdf31e3a10b362a89bfdccc925d816d038a6e727d1c9d5; consolidated CIR 1992 pp. 277, 279, and 515 at the pinned corpus revision.
format: rulespec/v1
imports:
  - be:statutes/income_tax/individual/tax_free_amount#belgium_pit_article_178_nearest_ten_rounding_multiple
module:
  summary: |-
    This module encodes selected federal personal income tax reductions and
    personal credits. It preserves the income-year-2025 / assessment-year-2026
    baseline and encodes the 15 July 2026 reform through assessment year 2031
    for the Article 147 base reductions and Article 289ter/1 fiscal work bonus.
    Article 147 keeps the enacted raw amounts distinct from their Article 178
    application and requires explicit Royal-Decree-neutralized raw inputs for
    AY2030 and AY2031; no unissued amount is interpolated. The work-bonus rates
    and indexed statutory ceiling follow Articles 96-97. Eligibility,
    attestations, product classification, joint-assessment allocation,
    regional reductions, and final imputation ordering remain separate.
  source_verification:
    corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-193"
units:
- name: EUR
  kind: currency
  minor_units: 2
