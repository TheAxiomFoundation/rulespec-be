format: rulespec/v1
imports:
  - be:statutes/income_tax/individual/tax_reductions_and_credits#belgium_pit_article_289ter1_work_bonus_a_rate
  - be:statutes/income_tax/individual/tax_reductions_and_credits#belgium_pit_article_289ter1_work_bonus_b_rate
  - be:statutes/income_tax/individual/tax_reductions_and_credits#belgium_pit_article_289ter1_work_bonus_credit_ceiling
module:
  summary: |-
    This page-scoped adapter exposes the canonical Article 289ter/1 work-bonus
    credit rates and ceiling under page-515-owned rule ids. It introduces no
    new numeric values; idempotent bounds preserve the imported parameters.
  source_verification:
    corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-515
units:
  - name: EUR
    kind: currency
    minor_units: 2
rules:
  - name: belgium_pit_article_289ter1_work_bonus_a_rate_from_page_515
    kind: parameter
    dtype: Rate
    source: CIR 1992 article 289ter/1, work-bonus credit rate for volet A
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-515
              excerpt: "Le crédit d'impôt est égal à: - 33,14 % du montant du volet A de la réduction des cotisations personnelles de sécurité sociale réellement accordée"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          min(belgium_pit_article_289ter1_work_bonus_a_rate, belgium_pit_article_289ter1_work_bonus_a_rate)
  - name: belgium_pit_article_289ter1_work_bonus_b_rate_from_page_515
    kind: parameter
    dtype: Rate
    source: CIR 1992 article 289ter/1, work-bonus credit rate for volet B
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-515
              excerpt: "et - 52,54 % du montant du volet B de la réduction des cotisations personnelles de sécurité sociale réellement accordée"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          min(belgium_pit_article_289ter1_work_bonus_b_rate, belgium_pit_article_289ter1_work_bonus_b_rate)
  - name: belgium_pit_article_289ter1_work_bonus_credit_ceiling_from_page_515
    kind: parameter
    dtype: Money
    unit: EUR
    source: CIR 1992 article 289ter/1, income year 2025 indexed work-bonus credit ceiling
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-515
              excerpt: "Le crédit d'impôt ne peut excéder par période imposable 1.540 euros (montant indexé)."
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          min(belgium_pit_article_289ter1_work_bonus_credit_ceiling, belgium_pit_article_289ter1_work_bonus_credit_ceiling)
