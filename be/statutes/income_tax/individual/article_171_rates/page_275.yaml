    kind: parameter
    dtype: Rate
    source: CIR 1992 Article 171 item 7, income year 2025
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-275
              excerpt: "7° au taux de 10,38 %:"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          0.1038
  - name: belgium_pit_article_171_item_8_rate
    kind: parameter
    dtype: Rate
