format: rulespec/v1
module:
  summary: |-
    CIR 1992 Article 171 items 7 and 8 set the 10.38-percent regional
    return-to-work-premium rate and the zero-percent Article 155 rate for
    income year 2025. Statutory class eligibility remains outside this
    page-scoped rate module.
  source_verification:
    corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-275"
rules:
