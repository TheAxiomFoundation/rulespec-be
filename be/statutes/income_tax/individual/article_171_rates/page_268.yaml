format: rulespec/v1
module:
  summary: |-
    CIR 1992 Article 171 item 1 taxes the enumerated separately taxable income
    classes at 33 percent for income year 2025. Classification of an amount
    into an item-1 class remains outside this page-scoped rate module.
  source_verification:
    corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-268"
rules:
  - name: belgium_pit_article_171_item_1_rate
    kind: parameter
    dtype: Rate
    source: CIR 1992 Article 171 item 1, income year 2025
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-268
              excerpt: "1° au taux de 33 %:"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          0.33
