  - name: belgium_pit_article_87_88_fixed_indexation_coefficient
    kind: derived
    entity: TaxUnit
    dtype: Decimal
    period: Year
    source: CIR 1992 article 178 section 3 special coefficient for Articles 87/88 through AY2045 and Article 87 paragraphs 2/3 from AY2046, inserted and retargeted by Article 104(c)-(d)
    metadata:
      proof:
        atoms:
        - path: versions[0].formula
          kind: formula
          source:
            authority: Moniteur belge
            publication_date: '2026-07-29'
            mb_page: '40219'
            law_article: '104(c), Article 178 section 3 paragraph 4'
            source_sha256: 033bfdecb456d5b901bdf31e3a10b362a89bfdccc925d816d038a6e727d1c9d5
            corpus_status: awaiting_ingestion
            excerpt: "l’adaptation pour les exercices d’imposition 2027 et suivants est effectuée au moyen du coefficient obtenu en divisant la moyenne des indices de l’année 2024 par la moyenne des indices de l’année 1988, multipliée par le rapport entre les moyennes des indices des années 1997 et 1991."
        - path: versions[0].formula
          kind: formula
          source:
            authority: Moniteur belge
            publication_date: '2026-07-29'
            mb_page: '40220'
            law_article: '104(d), Article 178 section 3 paragraph 4'
            source_sha256: 033bfdecb456d5b901bdf31e3a10b362a89bfdccc925d816d038a6e727d1c9d5
            corpus_status: awaiting_ingestion
            excerpt: "les mots “aux articles 87, alinéa 2, et 88, alinéas 1er et 2,” sont remplacés par les mots “aux articles 87, alinéas 2 et 3”"
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          floor(((floor(belgium_pit_article_87_88_2024_average_consumer_price_index * 100 + 0.5) / 100) / ((floor(belgium_pit_article_87_88_1988_average_consumer_price_index * 100 + 0.5) / 100) * ((floor(belgium_pit_article_87_88_1997_average_consumer_price_index * 100 + 0.5) / 100) / (floor(belgium_pit_article_87_88_1991_average_consumer_price_index * 100 + 0.5) / 100)))) * 10000 + 0.5) / 10000
