          law_article: '29, replacement Article 87 paragraphs 2 and 3'
          source_sha256: 033bfdecb456d5b901bdf31e3a10b362a89bfdccc925d816d038a6e727d1c9d5
          excerpt: "Lorsque qu’un seul des conjoints a perçu des revenus professionnels, une partie de ceux-ci est attribuée à l’autre conjoint. Cette quote-part est égale à 30 p.c. de ces revenus, sans pouvoir excéder 3.350 euros."
        - mb_page: '40204'
          law_article: '29, replacement Article 87 paragraph 3'
          source_sha256: 033bfdecb456d5b901bdf31e3a10b362a89bfdccc925d816d038a6e727d1c9d5
          excerpt: "Lorsque les revenus professionnels d’un conjoint n’atteignent pas 30 p.c. du montant total des revenus professionnels des deux conjoints, il lui est imputé une quote-part des revenus professionnels de l’autre conjoint qui, jointe à ses propres revenus professionnels, lui permet d’atteindre 30 p.c. de ce total, sans pouvoir excéder 3.350 euros."
