module:
  summary: |-
    CIR 1992 article 134 converts the tax-free amount into a tax reduction and
    sets the refundable child tax-credit cap for income year 2025 / assessment
    year 2026. Through AY2029 this module encodes the paragraph 2 tax scale;
    from AY2030 it applies the Article 130 scale as enacted by Article 10. It
    also encodes the AY2027 qualifying-scholarship exclusion, a mechanical tax
    after the tax-free-amount reduction, the paragraph 3 child-credit cap, a
    bridge from the Article 130 base tax to the refundable child credit, and
    the paragraph 4 joint-assessment tax-free-amount allocation for supplied
    spouse incomes, base amounts, and Article 132 supplements, and the
    paragraph 4 joint refundable-credit cap allocation for supplied uncapped
    spouse credits through AY2029. From AY2030 the per-spouse allocation is
    abolished and the module exposes only the capped household credit. The
    supplied post-reform uncapped components must already reflect Article
    10(l)'s transferred-tax-free-amount priority; this module cannot derive
    that composition from aggregate tax-free amounts. It leaves the Article
    133 branch, component-level child-reduction attribution, regional
    reductions, communal additions, and treaty-exempt income exclusions to
    later household modules.
  source_verification:
    corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-185"
units:
  - name: EUR
    kind: currency
    minor_units: 2
