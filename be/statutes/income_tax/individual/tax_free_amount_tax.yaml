              excerpt: "au conjoint d'un contribuable visé au premier tiret qui est taxé isolément conformément à l'article 126, § 2, alinéa 1er, 4°"
          - path: versions[1].formula
            kind: formula
            source:
              authority: Moniteur belge
              publication_date: '2026-07-29'
