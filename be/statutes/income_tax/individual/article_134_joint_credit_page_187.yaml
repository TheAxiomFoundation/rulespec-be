          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-187
              excerpt: "6° pour chaque conjoint, la partie de l'impôt calculée conformément au paragraphe 2, alinéa 2, sur la quotité du revenu exemptée d'impôt qui ne peut pas être portée en diminution de l'impôt calculé conformément à l'article 130, est, dans la mesure où elle concerne les suppléments visés à l'article 132, alinéa 1er, 1° à 6°, convertie en un crédit d'impôt remboursable."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-187
              excerpt: "Ce crédit d'impôt ne peut excéder le montant maximum déterminé conformément au paragraphe 3, alinéas 2 et 3, pour les deux conjoints ensemble."
          - path: versions[0].formula
