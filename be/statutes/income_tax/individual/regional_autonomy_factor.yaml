format: rulespec/v1
module:
  summary: |-
    The royal decree of 19 December 2017 fixes the definitive regional
    autonomy factor referenced by special-financing-law Article 5/2 at
    24.957 percent. This module exposes that percentage as a rate and the
    complementary State-tax share used by the individual and joint Belgian
    PIT oracle pipelines. It does not encode regional surcharges, reductions,
    credits, or the allocation of reduced State tax between Regions.
  source_verification:
    corpus_citation_path: be/regulation/arrete/2017/12/19/2017032216/article/1er
rules:
  - name: belgium_pit_pilot_article_5_2_autonomy_percent
    kind: parameter
    dtype: Decimal
    source: Royal decree of 19 December 2017 article 1, definitive autonomy factor stated as a percentage
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: be/regulation/arrete/2017/12/19/2017032216/article/1er
              excerpt: "Le facteur d'autonomie définitif visé à l'article 5/2, § 1er, alinéas 3 et 4, de la loi spéciale du 16 janvier 1989 relative au financement des Communautés et des Régions, est, sur la base des rapports de la Cour des comptes visés à l'article 81ter de la même loi spéciale, déterminé à 24,957 %."
    versions:
      - effective_from: '2018-01-01'
        formula: |-
          24.957
  - name: belgium_pit_pilot_article_5_2_autonomy_factor
    kind: parameter
    dtype: Rate
    source: Royal decree of 19 December 2017 article 1, definitive autonomy percentage converted to a rate
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: be/regulation/arrete/2017/12/19/2017032216/article/1er
              excerpt: "Le facteur d'autonomie définitif visé à l'article 5/2, § 1er, alinéas 3 et 4, de la loi spéciale du 16 janvier 1989 relative au financement des Communautés et des Régions, est, sur la base des rapports de la Cour des comptes visés à l'article 81ter de la même loi spéciale, déterminé à 24,957 %."
    versions:
      - effective_from: '2018-01-01'
        formula: |-
          0.24957
  - name: belgium_pit_pilot_article_5_2_state_tax_share_after_autonomy_factor
    kind: parameter
    dtype: Rate
    source: Special financing law article 5/2 reduced State tax share, using the definitive autonomy factor fixed by royal decree of 19 December 2017 article 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: be/regulation/arrete/2017/12/19/2017032216/article/1er
              excerpt: "Le facteur d'autonomie définitif visé à l'article 5/2, § 1er, alinéas 3 et 4, de la loi spéciale du 16 janvier 1989 relative au financement des Communautés et des Régions, est, sur la base des rapports de la Cour des comptes visés à l'article 81ter de la même loi spéciale, déterminé à 24,957 %."
    versions:
      - effective_from: '2018-01-01'
        formula: |-
          1 - belgium_pit_pilot_article_5_2_autonomy_factor
