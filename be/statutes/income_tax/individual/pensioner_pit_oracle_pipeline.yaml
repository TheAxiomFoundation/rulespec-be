rules:
  - name: belgium_pit_pensioner_monthly_gross_pension
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: Service federal des Pensions 2025 withholding tables state monthly gross pension amounts; the oracle slice supplies an annual gross Article 34 pension paid in equal monthly amounts
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_pensioner_annual_gross_pension / belgium_pensioner_health_and_solidarity_months_in_year
  - name: belgium_pit_pensioner_article_191_protected_floor_limit_monthly
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: Law on compulsory health-care and indemnity insurance coordinated on 14 July 1994, article 191, 7, monthly floor selected by the family-charge scale
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_beneficiary_has_family_charge:
              belgium_health_insurance_article_191_family_health_floor_lower_monthly
          else:
              belgium_health_insurance_article_191_isolated_health_floor_lower_monthly
  - name: belgium_pit_pensioner_article_191_full_rate_threshold_monthly
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: Law on compulsory health-care and indemnity insurance coordinated on 14 July 1994, article 191, 7, monthly phase-in ceiling selected by the family-charge scale
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_beneficiary_has_family_charge:
              belgium_health_insurance_article_191_family_health_floor_upper_monthly
          else:
              belgium_health_insurance_article_191_isolated_health_floor_upper_monthly
  - name: belgium_pit_pensioner_article_191_monthly_withholding
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: Law on compulsory health-care and indemnity insurance coordinated on 14 July 1994, article 191, 7, per-beneficiary AMI withholding on cumulated monthly gross pensions with the protected floor; the imported article-191 legal-basis adapter carries the direct statute proof for the rate, while the banded amounts are proven in non_labour_income_contributions against the Service federal des Pensions 2025 tables
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_monthly_gross_pension <= belgium_pit_pensioner_article_191_protected_floor_limit_monthly:
              0
          else:
              if belgium_pit_pensioner_monthly_gross_pension <= belgium_pit_pensioner_article_191_full_rate_threshold_monthly:
                  belgium_pit_pensioner_monthly_gross_pension - belgium_pit_pensioner_article_191_protected_floor_limit_monthly
              else:
                  belgium_pit_pensioner_monthly_gross_pension * belgium_pension_article_191_ami_withholding_rate
  - name: belgium_pit_pensioner_article_68_first_threshold
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: Law of 30 March 1994 on social provisions, article 68 section 2, first monthly threshold selected by the family-charge scale, 2025 indexed vintage
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_beneficiary_has_family_charge:
              belgium_pension_solidarity_article_68_family_first_threshold_base
          else:
              belgium_pension_solidarity_article_68_isolated_first_threshold_base
  - name: belgium_pit_pensioner_article_68_second_threshold
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: Law of 30 March 1994 on social provisions, article 68 section 2, second monthly threshold selected by the family-charge scale, 2025 indexed vintage
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_beneficiary_has_family_charge:
              belgium_pension_solidarity_article_68_family_second_threshold_base
          else:
              belgium_pension_solidarity_article_68_isolated_second_threshold_base
  - name: belgium_pit_pensioner_article_68_third_threshold
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: Law of 30 March 1994 on social provisions, article 68 section 2, third monthly threshold selected by the family-charge scale, 2025 indexed vintage
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_beneficiary_has_family_charge:
              belgium_pension_solidarity_article_68_family_third_threshold_base
          else:
              belgium_pension_solidarity_article_68_isolated_third_threshold_base
  - name: belgium_pit_pensioner_article_68_fourth_threshold
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: Law of 30 March 1994 on social provisions, article 68 section 2, fourth monthly threshold selected by the family-charge scale, 2025 indexed vintage
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_beneficiary_has_family_charge:
              belgium_pension_solidarity_article_68_family_fourth_threshold_base
          else:
              belgium_pension_solidarity_article_68_isolated_fourth_threshold_base
  - name: belgium_pit_pensioner_article_68_transition_base_amount
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: Law of 30 March 1994 on social provisions, article 68 section 2, transition-band constant equal to the mid rate applied to the third threshold
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_pensioner_article_68_third_threshold * belgium_pension_article_68_solidarity_mid_rate
  - name: belgium_pit_pensioner_article_68_monthly_withholding
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: Law of 30 March 1994 on social provisions, article 68 section 2, per-beneficiary solidarity contribution on cumulated monthly gross pensions; the imported article-68 legal-basis adapter carries direct statute proofs for the band rates, while the indexed amounts are proven in non_labour_income_contributions against the Service federal des Pensions 2025 tables
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_monthly_gross_pension <= belgium_pit_pensioner_article_68_first_threshold:
              0
          else:
              if belgium_pit_pensioner_monthly_gross_pension <= belgium_pit_pensioner_article_68_second_threshold:
                  (belgium_pit_pensioner_monthly_gross_pension - belgium_pit_pensioner_article_68_first_threshold) * belgium_pension_article_68_solidarity_phase_in_rate
              else:
                  if belgium_pit_pensioner_monthly_gross_pension <= belgium_pit_pensioner_article_68_third_threshold:
                      belgium_pit_pensioner_monthly_gross_pension * belgium_pension_article_68_solidarity_mid_rate
                  else:
                      if belgium_pit_pensioner_monthly_gross_pension <= belgium_pit_pensioner_article_68_fourth_threshold:
                          belgium_pit_pensioner_article_68_transition_base_amount + (belgium_pit_pensioner_monthly_gross_pension - belgium_pit_pensioner_article_68_third_threshold) * belgium_pension_article_68_solidarity_phase_in_rate
                      else:
                          belgium_pit_pensioner_monthly_gross_pension * belgium_pension_article_68_solidarity_top_rate
  - name: belgium_pit_pensioner_annual_social_withholding
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: Annual total of the article 191 health-insurance withholding and the article 68 solidarity contribution on the beneficiary's pension, composed to face the EUROMOD BE_2025 tscpe_s pensioner social-insurance-contribution output
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          (belgium_pit_pensioner_article_191_monthly_withholding + belgium_pit_pensioner_article_68_monthly_withholding) * belgium_pensioner_health_and_solidarity_months_in_year
  - name: belgium_pit_pensioner_net_pension
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 23 paragraph 2 item 1 netting of the article 52 item 7 personal social-legislation withholdings against the gross Article 34 pension category
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_pensioner_annual_gross_pension - belgium_pit_pensioner_annual_social_withholding)
  - name: belgium_pit_replacement_net_unemployment_benefit
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 articles 23 paragraph 2 and 146 item 3, net unemployment benefits; the BE_2025 oracle carries gross bun into taxable income without a personal social contribution
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_replacement_annual_gross_unemployment_benefit)
  - name: belgium_pit_replacement_net_sickness_invalidity_indemnity
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 articles 23 paragraph 2 and 146 item 4, statutory sickness and invalidity indemnities net of the supplied personal invalidity social withholding; primary sickness has no such withholding in the BE_2025 oracle
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_replacement_annual_gross_sickness_benefit + belgium_pit_replacement_annual_gross_invalidity_benefit - belgium_pit_replacement_annual_invalidity_social_withholding)
  - name: belgium_pit_replacement_total_net_replacement_income
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 articles 34 and 146, total net pension, unemployment, and statutory sickness or invalidity income in this replacement-income oracle slice
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_pensioner_net_pension + belgium_pit_replacement_net_unemployment_benefit + belgium_pit_replacement_net_sickness_invalidity_indemnity)
  - name: belgium_pit_pensioner_taxable_income
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 6, replacement-income oracle-slice taxable income from net pension, unemployment, and statutory sickness or invalidity income plus the worker pilot's net professional income for mixed activity cases
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_replacement_total_net_replacement_income + belgium_pit_pilot_worker_net_professional_income)
  - name: belgium_pit_pensioner_article_130_base_tax
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 130, pensioner oracle-slice taxable income through the ordinary rate scale
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_taxable_income <= belgium_pit_article_130_first_bracket_upper_threshold:
              belgium_pit_pensioner_taxable_income * belgium_pit_article_130_first_bracket_rate
          else:
              if belgium_pit_pensioner_taxable_income <= belgium_pit_article_130_second_bracket_upper_threshold:
                  belgium_pit_article_130_first_bracket_upper_threshold * belgium_pit_article_130_first_bracket_rate + (belgium_pit_pensioner_taxable_income - belgium_pit_article_130_first_bracket_upper_threshold) * belgium_pit_article_130_second_bracket_rate
              else:
                  if belgium_pit_pensioner_taxable_income <= belgium_pit_article_130_third_bracket_upper_threshold:
                      belgium_pit_article_130_first_bracket_upper_threshold * belgium_pit_article_130_first_bracket_rate + (belgium_pit_article_130_second_bracket_upper_threshold - belgium_pit_article_130_first_bracket_upper_threshold) * belgium_pit_article_130_second_bracket_rate + (belgium_pit_pensioner_taxable_income - belgium_pit_article_130_second_bracket_upper_threshold) * belgium_pit_article_130_third_bracket_rate
                  else:
                      belgium_pit_article_130_first_bracket_upper_threshold * belgium_pit_article_130_first_bracket_rate + (belgium_pit_article_130_second_bracket_upper_threshold - belgium_pit_article_130_first_bracket_upper_threshold) * belgium_pit_article_130_second_bracket_rate + (belgium_pit_article_130_third_bracket_upper_threshold - belgium_pit_article_130_second_bracket_upper_threshold) * belgium_pit_article_130_third_bracket_rate + (belgium_pit_pensioner_taxable_income - belgium_pit_article_130_third_bracket_upper_threshold) * belgium_pit_article_130_top_bracket_rate
  - name: belgium_pit_pensioner_tax_free_amount
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 131, base tax-free amount for the single-pensioner oracle slice without Article 132/133 supplements
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_base_tax_free_amount
  - name: belgium_pit_pensioner_article_134_tax_on_tax_free_amount
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 134 paragraph 2, tax on the pensioner-slice tax-free amount
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_tax_free_amount <= belgium_pit_article_134_first_tax_free_amount_threshold:
              belgium_pit_pensioner_tax_free_amount * belgium_pit_article_134_first_tax_free_amount_rate
          else:
              if belgium_pit_pensioner_tax_free_amount <= belgium_pit_article_134_second_tax_free_amount_threshold:
                  belgium_pit_article_134_first_tax_free_amount_threshold * belgium_pit_article_134_first_tax_free_amount_rate + (belgium_pit_pensioner_tax_free_amount - belgium_pit_article_134_first_tax_free_amount_threshold) * belgium_pit_article_134_second_tax_free_amount_rate
              else:
                  if belgium_pit_pensioner_tax_free_amount <= belgium_pit_article_134_third_tax_free_amount_threshold:
                      belgium_pit_article_134_first_tax_free_amount_threshold * belgium_pit_article_134_first_tax_free_amount_rate + (belgium_pit_article_134_second_tax_free_amount_threshold - belgium_pit_article_134_first_tax_free_amount_threshold) * belgium_pit_article_134_second_tax_free_amount_rate + (belgium_pit_pensioner_tax_free_amount - belgium_pit_article_134_second_tax_free_amount_threshold) * belgium_pit_article_134_third_tax_free_amount_rate
                  else:
                      if belgium_pit_pensioner_tax_free_amount <= belgium_pit_article_134_fourth_tax_free_amount_threshold:
                          belgium_pit_article_134_first_tax_free_amount_threshold * belgium_pit_article_134_first_tax_free_amount_rate + (belgium_pit_article_134_second_tax_free_amount_threshold - belgium_pit_article_134_first_tax_free_amount_threshold) * belgium_pit_article_134_second_tax_free_amount_rate + (belgium_pit_article_134_third_tax_free_amount_threshold - belgium_pit_article_134_second_tax_free_amount_threshold) * belgium_pit_article_134_third_tax_free_amount_rate + (belgium_pit_pensioner_tax_free_amount - belgium_pit_article_134_third_tax_free_amount_threshold) * belgium_pit_article_134_fourth_tax_free_amount_rate
                      else:
                          belgium_pit_article_134_first_tax_free_amount_threshold * belgium_pit_article_134_first_tax_free_amount_rate + (belgium_pit_article_134_second_tax_free_amount_threshold - belgium_pit_article_134_first_tax_free_amount_threshold) * belgium_pit_article_134_second_tax_free_amount_rate + (belgium_pit_article_134_third_tax_free_amount_threshold - belgium_pit_article_134_second_tax_free_amount_threshold) * belgium_pit_article_134_third_tax_free_amount_rate + (belgium_pit_article_134_fourth_tax_free_amount_threshold - belgium_pit_article_134_third_tax_free_amount_threshold) * belgium_pit_article_134_fourth_tax_free_amount_rate + (belgium_pit_pensioner_tax_free_amount - belgium_pit_article_134_fourth_tax_free_amount_threshold) * belgium_pit_article_134_top_tax_free_amount_rate
  - name: belgium_pit_pensioner_tax_after_tax_free_amount
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 articles 130 to 134, the impot determined under articles 130 to 145 on which the Article 147 reductions are granted
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-253"
              excerpt: "Sur l'impôt déterminé conformément aux articles 130 à 145 afférent aux pensions et aux revenus de remplacement, sont accordées les réductions suivantes:"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_pensioner_article_130_base_tax - belgium_pit_pensioner_article_134_tax_on_tax_free_amount)
  - name: belgium_pit_pensioner_activity_income
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 147 second alinea, activity income equal to professional income excluding Article 23 paragraph 1 item 5 pensions and temporary-loss indemnities; the pensioner oracle slice carries only the worker pilot's net wage income
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_pilot_worker_net_professional_income)
  - name: belgium_pit_pensioner_article_147_excluded_activity_income
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 147 first alinea item 2 b and c and third alinea, activity income excluded from the net-income denominator for pensioners past legal retirement age according to their distinct supplied legal-pension amount, and for survivor-pension or transition-allowance recipients
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-253"
              excerpt: "b) des revenus d'activités, dans le cas de l'obtention par un contribuable qui a atteint l'âge légal de la retraite, d'une pension légale qui ne dépasse pas 19.630 euros (montant indexé) ou dans le cas de l'obtention d'une pension de survie ou une allocation de transition;"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_receives_survivor_pension_or_transition_allowance:
              belgium_pit_pensioner_activity_income
          else:
              if belgium_pit_pensioner_has_reached_legal_retirement_age and belgium_pit_pensioner_annual_legal_pension <= belgium_pit_article_1511_additional_phaseout_start:
                  belgium_pit_pensioner_activity_income
              else:
                  if belgium_pit_pensioner_has_reached_legal_retirement_age and belgium_pit_pensioner_annual_legal_pension <= belgium_pit_article_1511_additional_phaseout_end:
                      belgium_pit_pensioner_activity_income * (belgium_pit_article_1511_additional_phaseout_end - belgium_pit_pensioner_annual_legal_pension) / (belgium_pit_article_1511_additional_phaseout_end - belgium_pit_article_1511_additional_phaseout_start)
                  else:
                      0
  - name: belgium_pit_pensioner_article_147_net_income_for_ratio
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 147 first alinea item 2, the net-income denominator after the b and c activity-income exclusions
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_pensioner_taxable_income - belgium_pit_pensioner_article_147_excluded_activity_income)
  - name: belgium_pit_pensioner_article_147_replacement_ratio
    kind: derived
    entity: Person
    dtype: Rate
    period: Year
    source: CIR 1992 article 147 first alinea items 1 and 2, proportion of the net pension in the net income that scales both the base and the additional reduction
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-253"
              excerpt: "2° lorsque le revenu net se compose partiellement de pensions ou d'autres revenus de remplacement: une quotité des montants visés au 1°, proportionnelle au rapport qu'il y a entre, d'une part, le montant net des pensions et des autres revenus de remplacement et, d'autre part, le montant du revenu net"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_article_147_net_income_for_ratio <= 0:
              0
          else:
              min(1, belgium_pit_pensioner_net_pension / belgium_pit_pensioner_article_147_net_income_for_ratio)
  - name: belgium_pit_pensioner_article_147_base_reduction_before_limits
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 147 first alinea items 1 and 2, base pension reduction scaled by the net-pension proportion
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_article_147_basic_replacement_reduction * belgium_pit_pensioner_article_147_replacement_ratio
  - name: belgium_pit_pensioner_article_147_additional_reduction_before_limits
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 147 first alinea items 1 and 2, additional pension reduction scaled by the net-pension proportion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-253"
              excerpt: "une réduction de base de 2.219,27 euros (montant indexé) et une réduction additionnelle de 457,23 euros (montant indexé);"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_article_147_additional_replacement_reduction * belgium_pit_pensioner_article_147_replacement_ratio
  - name: belgium_pit_replacement_article_147_unemployment_ratio
    kind: derived
    entity: Person
    dtype: Rate
    period: Year
    source: CIR 1992 article 147 items 7 and 8, net unemployment share of full net income; the item 2 activity-income exclusion is not applicable to item 8
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-253"
              excerpt: "lorsque le revenu net se compose partiellement d'allocations de chômage: une quotité des montants visés au 7°, proportionnelle au rapport entre, d'une part, le montant net des allocations de chômage et, d'autre part, le montant du revenu net;"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_taxable_income <= 0:
              0
          else:
              min(1, belgium_pit_replacement_net_unemployment_benefit / belgium_pit_pensioner_taxable_income)
  - name: belgium_pit_replacement_article_147_unemployment_base_reduction_before_limits
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 147 items 7 and 8, basic unemployment reduction prorated to the net-unemployment share
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_article_147_basic_replacement_reduction * belgium_pit_replacement_article_147_unemployment_ratio
  - name: belgium_pit_replacement_article_147_unemployment_additional_reduction_before_limits
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 147 items 7 and 8, additional unemployment reduction prorated to the net-unemployment share
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-253"
              excerpt: "lorsque le revenu net se compose exclusivement d'allocations de chômage: une réduction de base de 2.219,27 euros (montant indexé) et une réduction additionnelle de 457,23 euros (montant indexé);"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_article_147_additional_replacement_reduction * belgium_pit_replacement_article_147_unemployment_ratio
  - name: belgium_pit_replacement_article_147_sickness_invalidity_ratio
    kind: derived
    entity: Person
    dtype: Rate
    period: Year
    source: CIR 1992 article 147 items 9 and 10, net statutory sickness or invalidity share of full net income; item 10 is encoded from pinned-corpus page 254 but is unencoded_corpus_blocked because that page is absent from signed release be-rulespec-2026-07-10
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_taxable_income <= 0:
              0
          else:
              min(1, belgium_pit_replacement_net_sickness_invalidity_indemnity / belgium_pit_pensioner_taxable_income)
  - name: belgium_pit_replacement_article_147_sickness_invalidity_reduction_before_limits
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 147 items 9 and 10, statutory sickness or invalidity reduction prorated to its net-income share
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-253"
              excerpt: "lorsque le revenu net se compose exclusivement d'indemnités légales d'assurance en cas de maladie ou d'invalidité: 2.977,93 euros (montant indexé);"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_article_147_sickness_invalidity_reduction * belgium_pit_replacement_article_147_sickness_invalidity_ratio
  - name: belgium_pit_pensioner_article_152_base_reduction_factor
    kind: derived
    entity: Person
    dtype: Rate
    period: Year
    source: CIR 1992 article 152, one-third floor phaseout for the reductions other than those of articles 151 and 151/1
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_taxable_income >= belgium_pit_article_152_replacement_phaseout_end:
              1 / 3
          else:
              if belgium_pit_pensioner_taxable_income <= belgium_pit_article_152_replacement_phaseout_start:
                  1
              else:
                  1 / 3 + (2 / 3) * ((belgium_pit_article_152_replacement_phaseout_end - belgium_pit_pensioner_taxable_income) / (belgium_pit_article_152_replacement_phaseout_end - belgium_pit_article_152_replacement_phaseout_start))
  - name: belgium_pit_pensioner_article_1511_additional_reduction_factor
    kind: derived
    entity: Person
    dtype: Rate
    period: Year
    source: CIR 1992 article 151/1, phaseout of the additional reductions for pensions and other replacement income
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_pensioner_taxable_income >= belgium_pit_article_1511_additional_phaseout_end:
              0
          else:
              if belgium_pit_pensioner_taxable_income <= belgium_pit_article_1511_additional_phaseout_start:
                  1
              else:
                  (belgium_pit_article_1511_additional_phaseout_end - belgium_pit_pensioner_taxable_income) / (belgium_pit_article_1511_additional_phaseout_end - belgium_pit_article_1511_additional_phaseout_start)
  - name: belgium_pit_replacement_article_151_unemployment_base_reduction_factor
    kind: derived
    entity: Person
    dtype: Rate
    period: Year
    source: CIR 1992 article 151, taxable-income phaseout of the basic unemployment reduction with the statutory older-unemployed seniority-supplement exception
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_replacement_article_151_older_unemployed_with_seniority_supplement:
              1
          else:
              if belgium_pit_pensioner_taxable_income >= belgium_pit_article_151_unemployment_phaseout_end:
                  0
              else:
                  if belgium_pit_pensioner_taxable_income <= belgium_pit_article_151_unemployment_phaseout_start:
                      1
                  else:
                      (belgium_pit_article_151_unemployment_phaseout_end - belgium_pit_pensioner_taxable_income) / (belgium_pit_article_151_unemployment_phaseout_end - belgium_pit_article_151_unemployment_phaseout_start)
  - name: belgium_pit_pensioner_article_153_pension_tax_share_cap
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 153, cap of the reductions at the supplied share of the articles 130 to 145 tax attributable to the pension income for which they are granted; page 256 states the cap but supplies no allocation formula, so attribution is an explicit Person input boundary
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_pensioner_article_153_tax_share_attributable_to_pension_income)
  - name: belgium_pit_replacement_article_153_unemployment_tax_share_cap
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 153, cap of the unemployment reductions at the supplied share of the articles 130 to 145 tax attributable to the unemployment benefits for which they are granted; page 256 states the cap but supplies no allocation formula, so attribution is an explicit Person input boundary
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_replacement_article_153_tax_share_attributable_to_unemployment_benefits)
  - name: belgium_pit_replacement_article_153_sickness_invalidity_tax_share_cap
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 153, cap of the sickness-or-invalidity reductions at the supplied share of the articles 130 to 145 tax attributable to the statutory sickness or invalidity indemnities for which they are granted; page 256 states the cap but supplies no allocation formula, so attribution is an explicit Person input boundary
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_replacement_article_153_tax_share_attributable_to_sickness_invalidity_indemnities)
  - name: belgium_pit_replacement_pension_reduction_after_limits
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 articles 147, 151/1, 152, and 153, pension-category reduction after phaseouts and the attributable-tax cap
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          min(belgium_pit_pensioner_article_147_base_reduction_before_limits * belgium_pit_pensioner_article_152_base_reduction_factor + belgium_pit_pensioner_article_147_additional_reduction_before_limits * belgium_pit_pensioner_article_1511_additional_reduction_factor, belgium_pit_pensioner_article_153_pension_tax_share_cap)
  - name: belgium_pit_replacement_unemployment_reduction_after_limits
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 articles 147, 151, 151/1, and 153, unemployment-category base and additional reductions after their separate phaseouts and attributable-tax cap
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          min(belgium_pit_replacement_article_147_unemployment_base_reduction_before_limits * belgium_pit_replacement_article_151_unemployment_base_reduction_factor + belgium_pit_replacement_article_147_unemployment_additional_reduction_before_limits * belgium_pit_pensioner_article_1511_additional_reduction_factor, belgium_pit_replacement_article_153_unemployment_tax_share_cap)
  - name: belgium_pit_replacement_sickness_invalidity_reduction_after_limits
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 articles 147, 152, and 153, sickness-or-invalidity-category reduction after the Article 152 phaseout and attributable-tax cap
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          min(belgium_pit_replacement_article_147_sickness_invalidity_reduction_before_limits * belgium_pit_pensioner_article_152_base_reduction_factor, belgium_pit_replacement_article_153_sickness_invalidity_tax_share_cap)
  - name: belgium_pit_pensioner_replacement_reduction_after_limits
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 articles 147, 151, 151/1, 152, and 153, total pension, unemployment, and sickness-or-invalidity reductions after category-specific phaseouts and caps; the legacy identifier is retained for Lane-P compatibility
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_replacement_pension_reduction_after_limits + belgium_pit_replacement_unemployment_reduction_after_limits + belgium_pit_replacement_sickness_invalidity_reduction_after_limits
  - name: belgium_pit_replacement_tax_after_articles_147_to_153
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 articles 147 to 153, tax remaining after the category-specific replacement-income reductions and before the Article 154 complementary reduction
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_pensioner_tax_after_tax_free_amount - belgium_pit_pensioner_replacement_reduction_after_limits)
  - name: belgium_pit_replacement_article_154_pension_tax_remaining
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 154 section 3/1, tax remaining after articles 147 to 153 attributable to pensions and other replacement income in this slice
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_pensioner_article_153_pension_tax_share_cap - belgium_pit_replacement_pension_reduction_after_limits)
  - name: belgium_pit_replacement_article_154_unemployment_tax_remaining
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 154 section 3/1, tax remaining after articles 147 to 153 attributable to unemployment benefits
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_replacement_article_153_unemployment_tax_share_cap - belgium_pit_replacement_unemployment_reduction_after_limits)
  - name: belgium_pit_replacement_article_154_sickness_invalidity_tax_remaining
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 154 section 3/1, tax remaining after articles 147 to 153 attributable to statutory sickness or invalidity indemnities
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_replacement_article_153_sickness_invalidity_tax_share_cap - belgium_pit_replacement_sickness_invalidity_reduction_after_limits)
  - name: belgium_pit_replacement_article_154_attributable_tax_remaining
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 154 section 3/1, total remaining tax attributable to the three replacement-income category groups used for allocation
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_pit_replacement_article_154_pension_tax_remaining + belgium_pit_replacement_article_154_unemployment_tax_remaining + belgium_pit_replacement_article_154_sickness_invalidity_tax_remaining
  - name: belgium_pit_replacement_article_154_complementary_reduction
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 154 sections 1 to 3/1, complementary reduction for income composed exclusively of unemployment benefits or unemployment plus the replacement-income categories represented in this slice; section 1 and the section 2 rate are promoted, while the remaining section 2 eligibility details and sections 3 and 3/1 are encoded from pinned-corpus page 257 and remain unencoded_corpus_blocked
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_replacement_net_unemployment_benefit <= 0:
              0
          else:
              if belgium_pit_pilot_worker_net_professional_income > 0:
                  0
              else:
                  if belgium_pit_pensioner_net_pension + belgium_pit_replacement_net_sickness_invalidity_indemnity <= 0:
                      if belgium_pit_replacement_net_unemployment_benefit <= belgium_pit_replacement_article_154_first_twelve_month_maximum_unemployment_benefit:
                          belgium_pit_replacement_tax_after_articles_147_to_153 * belgium_pit_article_154_complementary_reduction_rate
                      else:
                          max(0, belgium_pit_replacement_tax_after_articles_147_to_153 - (belgium_pit_replacement_net_unemployment_benefit - belgium_pit_replacement_article_154_first_twelve_month_maximum_unemployment_benefit)) * belgium_pit_article_154_complementary_reduction_rate
                  else:
                      if belgium_pit_replacement_total_net_replacement_income <= belgium_pit_article_1511_additional_phaseout_start:
                          belgium_pit_replacement_tax_after_articles_147_to_153 * belgium_pit_article_154_complementary_reduction_rate
                      else:
                          max(0, belgium_pit_replacement_tax_after_articles_147_to_153 - (belgium_pit_replacement_total_net_replacement_income - belgium_pit_article_1511_additional_phaseout_start) * belgium_pit_replacement_article_154_mixed_replacement_excess_rate) * belgium_pit_article_154_complementary_reduction_rate
  - name: belgium_pit_replacement_article_154_section_3_1_pension_allocation
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 154 section 3/1, complementary-reduction allocation to the remaining pension and other-replacement tax share in qualifying mixed cases; encoded from pinned-corpus page 257 and unencoded_corpus_blocked at the signed-release frontier
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_replacement_net_unemployment_benefit <= 0 or belgium_pit_pensioner_net_pension + belgium_pit_replacement_net_sickness_invalidity_indemnity <= 0 or belgium_pit_pilot_worker_net_professional_income > 0 or belgium_pit_replacement_article_154_attributable_tax_remaining <= 0:
              0
          else:
              belgium_pit_replacement_article_154_complementary_reduction * belgium_pit_replacement_article_154_pension_tax_remaining / belgium_pit_replacement_article_154_attributable_tax_remaining
  - name: belgium_pit_replacement_article_154_section_3_1_unemployment_allocation
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 154 section 3/1, complementary-reduction allocation to the remaining unemployment tax share in qualifying mixed cases; encoded from pinned-corpus page 257 and unencoded_corpus_blocked at the signed-release frontier
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_replacement_net_unemployment_benefit <= 0 or belgium_pit_pensioner_net_pension + belgium_pit_replacement_net_sickness_invalidity_indemnity <= 0 or belgium_pit_pilot_worker_net_professional_income > 0 or belgium_pit_replacement_article_154_attributable_tax_remaining <= 0:
              0
          else:
              belgium_pit_replacement_article_154_complementary_reduction * belgium_pit_replacement_article_154_unemployment_tax_remaining / belgium_pit_replacement_article_154_attributable_tax_remaining
  - name: belgium_pit_replacement_article_154_section_3_1_sickness_invalidity_allocation
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 article 154 section 3/1, complementary-reduction allocation to the remaining sickness-or-invalidity tax share in qualifying mixed cases; encoded from pinned-corpus page 257 and unencoded_corpus_blocked at the signed-release frontier
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_replacement_net_unemployment_benefit <= 0 or belgium_pit_pensioner_net_pension + belgium_pit_replacement_net_sickness_invalidity_indemnity <= 0 or belgium_pit_pilot_worker_net_professional_income > 0 or belgium_pit_replacement_article_154_attributable_tax_remaining <= 0:
              0
          else:
              belgium_pit_replacement_article_154_complementary_reduction * belgium_pit_replacement_article_154_sickness_invalidity_tax_remaining / belgium_pit_replacement_article_154_attributable_tax_remaining
  - name: belgium_pit_pensioner_net_federal_tax_after_replacement_reductions
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: CIR 1992 articles 130 to 154, federal tax on the replacement-income slice after the tax-free amount, category reductions, and Article 154 complementary reduction
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          max(0, belgium_pit_replacement_tax_after_articles_147_to_153 - belgium_pit_replacement_article_154_complementary_reduction)
  - name: belgium_pit_pensioner_reduced_state_tax_after_autonomy_factor
    kind: derived
