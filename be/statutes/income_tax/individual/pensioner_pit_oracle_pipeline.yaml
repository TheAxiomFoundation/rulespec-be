    source: CIR 1992 articles 465 to 468, supplied local additions calculated on the pensioner-slice pre-credit total tax; Articles 290 and 304 impute the refundable Article 289ter/1 credit only afterward, including any surplus against these additions; the Article 466 movable-income subtraction and Article 466bis treaty interface are outside this slice
