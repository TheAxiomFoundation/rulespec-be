        formula: |-
          belgium_pit_pensioner_reduced_state_tax_after_autonomy_factor - belgium_pit_pilot_article_289ter1_low_wage_work_bonus_credit
  - name: belgium_pit_pensioner_agglomeration_additional_tax_rate_after_cap
