module:
  summary: |-
    This composed pilot module exposes a dense-engine-friendly Person-level
    path from gross Article 34 pension, unemployment-benefit, and statutory
    sickness or invalidity income into Belgian PIT for the EUROMOD oracle
    slice, including the Article 146 to 154 reduction machinery. The gross
    Article 34 input remains the total pension income, including complementary
    pension, while a distinct supplied legal-pension amount governs the
    Article 147 item 2 b and c activity-income exclusions. It retains the
    pensioner filename and existing output identifiers for Lane-P
    compatibility while generalizing the calculation by replacement-income
    category. It integrates the
    non_labour_income_contributions module by importing that module's Article
    191 health-insurance withholding rate and floors and Article 68
    solidarity-contribution thresholds and rates and re-applying them per
    beneficiary, exactly as the statutory tables state them per pensioner
    with the isolated or charge-de-famille scale; that module's own
    entity-level originals remain canonical for cumulated pension stacks
    spanning several payers. The Article 23 paragraph 2 netting
    deducts those Article 52 item 7 social withholdings from the gross
    pension. Unemployment benefits have no personal social contribution in
    the BE_2025 model slice, while sickness or invalidity indemnities deduct a
    supplied personal social withholding at the Article 23 paragraph 2
    boundary so primary-sickness and invalidity contribution regimes can be
    composed without conflation. The Article 6 taxable income adds the worker
    pilot's Person-scoped net professional income for mixed activity cases,
    and the
    encoded Article 130 rate scale, Article 131 base tax-free amount, and
    Article 134 tax-free-amount reduction produce the Articles 130 to 145
    tax. On that tax the module applies the Article 147 base and additional
    reductions with the statutory proration to each net replacement-income share
    (including the Article 147 item 2 b and c activity-income exclusions for
    pensioners past legal retirement age), the Article 151/1 additional-
    reduction phaseout, the Article 152 one-third floor phaseout, and the
    Article 151 unemployment phaseout, the Article 153 per-category caps
    through explicit supplied attribution boundaries (the pinned text states
    the cap but not an allocation formula), and
    the Article 154 complementary-reduction structure for qualifying
    unemployment-only and unemployment-plus-replacement-income cases,
    including section 3/1 allocation. The Article 154 40 percent reduction
    rate is imported with a verbatim proof from promoted page 256. The 90
    percent mixed-income excess rate remains a supplied input because its CIR
    1992 text is on page 257, which is absent from signed corpus release
    be-rulespec-2026-07-10. The item 10 sickness-or-invalidity proration on
    page 254 and the section 3 and 3/1 mechanics on page 257 are encoded from
    the pinned git corpus; these remain unencoded_corpus_blocked at the
    signed-release frontier until those pages are promoted. The
    first-twelve-month unemployment maximum used by Article 154 section 2 is
    also supplied because the provision specifies its vintage but no numeric
    amount. The module then applies the special-financing-law Article 5/2
    autonomy factor, supplied Article 465/468 local additions calculated on
    the pre-credit total tax, and only afterward the imported refundable
    Article 289ter/1 work-bonus credit under Articles 290 and 304. Also
    excluded: dependants and Article 132/133 supplements, joint assessment,
    other
    income categories, the Article 466/466bis movable and treaty interfaces,
    actual-expense proof, regional reductions and credits, and withholding
    settlement. The one-third limit majoration of Article 152 divides by the
    difference between its end and start amounts as the statute writes it;
    for assessment year 2026 that difference equals the start amount.
