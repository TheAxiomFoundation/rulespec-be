format: rulespec/v1
imports:
  - be:statutes/income_tax/individual/communal_additions#belgium_pit_article_468_agglomeration_additional_tax_rate_cap
module:
  summary: |-
    This page-scoped adapter exposes the canonical Article 468 agglomeration
    addition cap under a page-687-owned rule id. It introduces no new numeric
    value; an idempotent bound preserves the imported cap.
  source_verification:
    corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-687
rules:
  - name: belgium_pit_article_468_agglomeration_additional_tax_rate_cap_from_page_687
    kind: parameter
    dtype: Rate
    source: CIR 1992 article 468, agglomeration tax may not exceed 1 percent
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-687
              excerpt: "ce pourcentage ne peut excéder 1 % lorsque la taxe est établie par une agglomération"
    versions:
      - effective_from: '2015-01-01'
        formula: |-
          min(belgium_pit_article_468_agglomeration_additional_tax_rate_cap, belgium_pit_article_468_agglomeration_additional_tax_rate_cap)
