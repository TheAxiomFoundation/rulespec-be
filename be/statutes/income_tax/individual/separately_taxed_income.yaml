  - name: belgium_pit_article_171_selected_separate_or_globalised_tax
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: EUR
    source: Article 171 opening State-tax comparison, supplied selector and consistent incremental ordinary-State-tax alternative for Article 171 income
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-268"
              excerpt: "sont imposables distinctement, sauf si l'impôt ainsi calculé, majoré de l'impôt Etat afférent aux autres revenus, est supérieur à l'impôt calculé conformément aux articles précités"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if belgium_pit_article_171_state_tax_comparison_selects_globalised_ordinary_tax:
              max(0, belgium_pit_article_171_supplied_incremental_ordinary_state_tax_on_article_171_income_when_globalised)
          else:
