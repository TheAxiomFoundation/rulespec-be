        formula: |-
          belgium_pit_article_171_item_1_tax + belgium_pit_article_171_item_1bis_tax + belgium_pit_article_171_item_2_tax + belgium_pit_article_171_item_2bis_tax + belgium_pit_article_171_item_2quater_tax + belgium_pit_article_171_item_3_non_movable_miscellaneous_tax + belgium_pit_article_171_item_3bis_tax + belgium_pit_article_171_item_3quater_tax + belgium_pit_article_171_item_3sexies_twenty_percent_class_tax + belgium_pit_article_171_item_3sexies_fifteen_percent_class_tax + belgium_pit_article_171_item_3septies_at_least_five_year_tax + belgium_pit_article_171_item_3septies_under_five_year_tax + belgium_pit_article_171_item_4_tax + belgium_pit_article_171_item_4bis_tax + belgium_pit_article_171_item_7_tax + belgium_pit_article_171_item_8_tax
