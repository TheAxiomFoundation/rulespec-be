module:
  summary: |-
    CIR 1992 Article 171 subjects enumerated Person income classes to separate
    rates when its comparison with ordinary taxation does not produce a lower
    ordinary-tax result. This module encodes every machine-groundable fixed
    rate stated on the pinned income-year-2025 Article 171 pages and computes
    row-level tax from
    supplied, already-classified taxable bases. Aggregate row boundaries name
    their statutory subitem spans; classification and every applicable Article
    171/1 and Articles 172 to 174/1 adjustment remain caller responsibilities.
    The module imports the conformant existing general movable-income and
    regulated-savings tax surfaces instead of duplicating them. Article 171
    item 3sexies has distinct supplied 20-percent and 15-percent source-class
    bases, including the corresponding private-pricaf source dividends. The
    rate inherited by missing-coupon or missing-prize compensation, the prior-
    year-average rate, and the rate on other taxable income remain named
    dynamic-rate inputs. Item 4bis remains a named 12.5-percent rate boundary
    because the pinned extracted text splits its decimal as "12, 5 %"; item
    2ter is literally omitted and remains a named supplied-tax boundary. The opening
    comparison is an explicit supplied State-tax-comparison selector and
    consistent incremental ordinary-State-tax boundary. The tin integration
    adds the selected Article 171 liability to a supplied ordinary federal,
    regional, and local amount that must already include the Article 466 local-
    base increment. That increment and the supplied nonprofessional-movable
    exclusion share are exposed separately for wiring.
  source_verification:
    corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-268"
units:
  - name: EUR
    kind: currency
    minor_units: 2
