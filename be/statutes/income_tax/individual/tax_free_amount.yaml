# Provenance: Moniteur belge 29 July 2026, pp. 40196-40199 and 40219-40220; pinned PDF SHA-256 033bfdecb456d5b901bdf31e3a10b362a89bfdccc925d816d038a6e727d1c9d5.
format: rulespec/v1
module:
  summary: |-
    CIR 1992 articles 131 and 132 set the tax-free amount and dependant
    increments. This module preserves the 2025 indexed baseline and encodes the
    15 July 2026 reform's raw statutory bases separately from their Article 178
    application. AY2027-2029 calculate the general Article 178 coefficient
    from explicit CPI-average inputs; AY2030 and AY2031 use the law-fixed
    post-Article-178 targets. From AY2032 the King-modified raw base is an
    explicit dependency and ordinary Article 178 indexation resumes, so no
    delegated amount is guessed or frozen. Article 132 calculates its
    separately enacted coefficient from explicit CPI-average inputs, so the
    AY2031 future-CPI dependency is not interpolated.
  source_verification:
    corpus_citation_path: "be/statute/fisconetplus/cir92/revenus-2025/page-181"
units:
  - name: EUR
    kind: currency
    minor_units: 2
rules:
  - name: belgium_pit_article_178_nearest_ten_rounding_multiple
    kind: parameter
    dtype: Money
    unit: EUR
    source: CIR 1992 article 178 section 2, nearest-EUR-10 rounding for indexed amounts; consolidated income-year-2025 text
    metadata:
      proof:
        atoms:
        - path: versions[0].formula
          kind: parameter
          source:
            corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-279
            excerpt: "Après application du coefficient, les montants sont, à l'exception de ceux mentionnés aux articles 21, alinéa 1er, 14°, 66bis, alinéa 3, 14535, alinéa 6, du montant de l'indemnité kilométrique visé à l'article 38, § 1er, alinéa 1er, 14°, a, et des montants des réductions visés à l'article 147, arrondis au multiple de 10 euros supérieur ou inférieur selon que le chiffre des unités atteint ou non 5."
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          10
  - name: belgium_pit_article_178_general_indexation_coefficient
    kind: derived
    entity: Person
    dtype: Decimal
    period: Year
    source: CIR 1992 article 178 section 2; general coefficient and statutory rounding calculated from explicit annual CPI-average inputs
    metadata:
      proof:
        atoms:
        - path: versions[0].formula
          kind: formula
          source:
            corpus_citation_path: be/statute/fisconetplus/cir92/revenus-2025/page-279
            excerpt: "L'adaptation est réalisée à l'aide du coefficient qui est obtenu en divisant la moyenne des indices des prix de l'année qui précède celle des revenus par la moyenne des indices des prix de l'année 1988. Pour le calcul du coefficient, on arrondit de la manière suivante: 1° la moyenne des indices est arrondie au centième supérieur ou inférieur d'un point selon que le chiffre des millièmes d'un point atteint ou non 5; 2° le coefficient est arrondi au dix millième supérieur ou inférieur selon que le chiffre des cent millièmes atteint ou non 5."
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          floor(((floor(belgium_pit_article_178_prior_income_year_average_consumer_price_index * 100 + 0.5) / 100) / (floor(belgium_pit_article_178_1988_average_consumer_price_index * 100 + 0.5) / 100)) * 10000 + 0.5) / 10000
  - name: belgium_pit_article_132_supplement_indexation_coefficient
    kind: derived
    entity: Person
    dtype: Decimal
    period: Year
    source: CIR 1992 article 178 section 2/1 inserted by Article 104(b) of the law of 15 July 2026; explicit CPI-average formula with statutory coefficient rounding
    metadata:
      proof:
        atoms:
        - path: versions[0].formula
          kind: formula
          source:
            authority: Moniteur belge
            publication_date: '2026-07-29'
            mb_page: '40219'
            law_article: '104(b), Article 178 section 2/1, 1°'
            source_sha256: 033bfdecb456d5b901bdf31e3a10b362a89bfdccc925d816d038a6e727d1c9d5
            corpus_status: awaiting_ingestion
            excerpt: "1° pour les exercices d’imposition 2027 à 2030 au moyen du coefficient qui est obtenu en divisant la moyenne des indices des prix de l’année 2024 par la moyenne des indices de l’année 1988 ;"
        - path: versions[1].formula
          kind: formula
          source:
            authority: Moniteur belge
            publication_date: '2026-07-29'
            mb_page: '40219'
            law_article: '104(b), Article 178 section 2/1, 2°'
            source_sha256: 033bfdecb456d5b901bdf31e3a10b362a89bfdccc925d816d038a6e727d1c9d5
            corpus_status: awaiting_ingestion
            excerpt: "2° pour les exercices d’imposition 2031 et suivants au moyen du coefficient qui est obtenu en divisant la moyenne des indices de l’année qui précède celle des revenus par la moyenne des indices de l’année 1988 multipliée par le rapport entre les moyennes des indices des années 2028 et 2024.”"
    versions:
      - effective_from: '2026-01-01'
        formula: |-
          floor(((floor(belgium_pit_article_178_2024_average_consumer_price_index * 100 + 0.5) / 100) / (floor(belgium_pit_article_178_1988_average_consumer_price_index * 100 + 0.5) / 100)) * 10000 + 0.5) / 10000
      - effective_from: '2030-01-01'
        formula: |-
          floor(((floor(belgium_pit_article_178_prior_income_year_average_consumer_price_index * 100 + 0.5) / 100) / ((floor(belgium_pit_article_178_1988_average_consumer_price_index * 100 + 0.5) / 100) * ((floor(belgium_pit_article_178_2028_average_consumer_price_index * 100 + 0.5) / 100) / (floor(belgium_pit_article_178_2024_average_consumer_price_index * 100 + 0.5) / 100)))) * 10000 + 0.5) / 10000
