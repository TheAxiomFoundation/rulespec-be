format: rulespec/v1
module:
  summary: |-
    This module supplies only the indexed 2025 family-benefit schedule entries
    that are absent from the existing federal, regional, and base-only 2025
    amount modules.  It covers the missing Flemish legacy ranks, legacy social
    and high age tracks, current-scheme social bands, and the missing Walloon
    legacy ranks, social amounts, annual premiums, and current-scheme family
    supplements.  Composition remains in a separate child-scoped module.
  source_verification:
    corpus_citation_path: "be-vlg/guidance/gpedia/family-benefits/amount-scale-2024-09/schedule-3"
units:
  - name: EUR
    kind: currency
    minor_units: 2
rules:
  - name: belgium_child_benefit_flanders_legacy_second_rank_2025_monthly_amount
    kind: parameter
    dtype: Money
    period: Month
    unit: EUR
    source: Flemish Article 210 indexed legacy second-rank amount in the official schedule applicable during 2025
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: be-vlg/guidance/gpedia/family-benefits/amount-scale-2024-09/schedule-3
              excerpt: "AGENTSCHAP\n\nUITBETALING\n\nGROEIPAKKET Gehuwde/zelfstandige/ alleenstaande € 861,32 € 3.948,79 - leerlingen Leerlingen in 3de lj. van 3de graad extern € 338,97 € 1.367,61 € 1.605,78 voltijds technisch of beroeps- intern € 876,02 € 2.248,28 - secundair Alle anderen voltijds secundair extern € 282,37 € 1.139,56 € 1338,01 onderwijs intern € 730,02 € 187351 - Stelsel leren en werken € 237,45 € 649,26 € 837,58 Verpleegkundigen in hoger beroeps- | extern € 1.002,45 € 1.464,48 - onderwijs intern € 1.002,45 € 4398,11 -\n\nBOEK 5 GEZINSBIJSLAGEN\n\nKRAAMGELD Iste kind of meerling € 1.272,52 2° of volgende kind € 957,42\n\nBASISKINDERBIJSLAGEN\n\nGEWONE KINDERBIJSLAG (Artikel 210, §2 Groeipakketdecreet)\n\njongste kind (laag) € 103,72 2de jongste kind (midden) € 191,92 3de jongste en oudere kinderen (hoog) € 259,49 | geen indexering tot\n\naugustus 2025\n\nWEZEN (Artikel 214 Groeipakketdecreet)\n\nper weeskind € 398,39\n\nFORFAITAIRE KINDERBIJSLAG OF FORFAITAIRE € 69,59 BIJZONDERE BIJSLAG VOOR KINDEREN\n\nGEPLAATST BIJ EEN PARTICULIER (Artikel 219 en\n\nartikel 221 Groeipakketdecreet)\n\nSOCIALE TOESLAGEN\n\nTOESLAGEN VOOR EEN RECHTGEVEND KIND DAT RECHT GEEFT OP KINDERBIJSLAG VERMELD IN ARTIKEL 210,§1 OF DE GEWONE WEZENBUSLAG (Artikel 222, §1 Groeipakketdecreet)\n\nkind dat recht geeft op 92,09 EUR € 68,41"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          191.92
