            kind: parameter
            source:
              corpus_citation_path: be-vlg/guidance/gpedia/family-benefits/start-amount-decision-2025-112/page-1
              excerpt: "www.groeipakket.be Beslissing Geschillencommissie nr. 2025/112 van 19 december 2025\n\nINLEIDENDE SAMENVATTING\n\nDe uitbetalingsactor vordert het startbedrag geboorte van €1.238,78 terug omdat het kind, geboren in Nederland, niet binnen de twee maanden na de geboorte werd ingeschreven in België. Omwille van de verrekening van de verschilbetaling, vordert de uitbetaler uiteindelijk €1.058,59 terug."
