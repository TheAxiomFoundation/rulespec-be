format: rulespec/v1
module:
  summary: |-
    This module records official one-off birth-allowance amounts for Brussels,
    Flanders, Wallonia, and the German-speaking Community. It keeps each
    jurisdiction's amount distinct and does not create internal region codes,
    a child-age proxy for a birth event, or a cross-jurisdiction routing rule.
    Broader family-benefit eligibility, payment administration, adoption
    premiums, and monthly child benefits remain separate surfaces.
  source_verification:
    corpus_citation_path: "be-bru/statute/ordonnance/2019/04/25/2019012118/article/16"
units:
  - name: EUR
    kind: currency
    minor_units: 2
rules:
  - name: belgium_family_benefits_birth_allowance_brussels_first_child_or_multiple_birth_2025_amount
    kind: parameter
    dtype: Money
    period: Year
    unit: EUR
    source: Brussels family-benefits ordinance of 25 April 2019, article 16, indexed amount in force from 1 February 2025
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: be-bru/guidance/iriscare/family-benefits/amount-scale-2025-02/block-13
              excerpt: "Premier né pour un des parents 1.367,74 EUR Chaque enfant issu d'un accouhement mutiple 1.367,74 EUR Toute autre situation 621,70 EUR"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          1367.74
