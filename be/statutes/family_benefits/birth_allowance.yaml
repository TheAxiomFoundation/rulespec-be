              excerpt: "dans les trois 104,46 € 6 - 8 points dans les trois piliers et moins de 4 points dans le 1er pilier 139,12 € 6 - 8 points dans les trois piliers et au moins 4 points dans le 1er pilier 535,90 € Prime d’adoption Par enfant adopté 1.367,74 € Allocation supplémentaire pour enfants atteints d’une affection et âgés de moins de 21 ans (nouveau système) Gravité de l’affection Prime de naissance Par enfant né 1.367,74 € Montants au 01.02.2025 5"
    versions:
