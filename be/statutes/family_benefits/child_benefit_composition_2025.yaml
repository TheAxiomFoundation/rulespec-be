module:
  summary: |-
    Child-scoped 2025 composition for Belgian family benefits.  The surface
    routes Flemish and Walloon children through the preserved or current
    cohort schedules, composes base, age, income, single-parent, status and
    annual-participation components, and then rolls beneficiary children to
    one Household output.  Brussels Article 39 and German-speaking Community
    Article 111 protections are recipient-level frozen amounts and are
    therefore applied only after relation aggregation, before current annual
    premiums.
  source_verification:
    corpus_citation_path: "be-vlg/statute/decreet/2018/04/27/2018040369/article/210"
units:
  - name: EUR
    kind: currency
    minor_units: 2
rules:
  - name: belgium_child_benefit_composition_beneficiary_child_of_household
    kind: data_relation
    data_relation:
      predicate: belgium_child_benefit_composition_beneficiary_child_of_household
      arity: 2
      arguments: [Household, Child]
    source: Explicit household-to-beneficiary-child relation used for child-scoped benefit aggregation
  - name: belgium_child_benefit_composition_flanders_legacy_social_eligibility
    kind: derived
    entity: Child
    dtype: Judgment
    period: Year
    source: Flemish preserved-family social-supplement income and mixed-cohort conditions
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_child_benefit_composition_annual_household_income <= belgium_child_benefit_flanders_social_low_income_2025_threshold or (belgium_child_benefit_composition_flemish_household_has_new_scheme_child and belgium_child_benefit_composition_beneficiary_child_count >= belgium_family_benefits_child_benefit_three_child_count and belgium_child_benefit_composition_annual_household_income <= belgium_child_benefit_flanders_social_middle_large_family_2025_threshold)
  - name: belgium_child_benefit_composition_wallonia_legacy_social_eligibility
    kind: derived
    entity: Child
    dtype: Judgment
    period: Year
    source: Walloon preserved LGAF low-income supplement condition
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          belgium_child_benefit_composition_annual_household_income <= belgium_child_benefit_wallonia_article_13_2025_low_income_threshold
  - name: belgium_child_benefit_composition_monthly_base_amount
    kind: derived
    entity: Child
    dtype: Money
    period: Month
    unit: EUR
    source: Imported applied regional base schedules selected by region, cohort and frozen legacy rank
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          if not belgium_child_benefit_composition_is_beneficiary_child:
              0
          else:
              if belgium_family_benefits_transition_region == belgium_family_benefits_child_benefit_region_flanders:
                  if belgium_family_benefits_transition_flanders_legacy_lgaf_child_route_applies:
                      if belgium_child_benefit_composition_is_orphan or belgium_child_benefit_composition_is_full_orphan:
                          belgium_child_benefit_flanders_legacy_orphan_2025_monthly_amount
                      else:
                          if belgium_child_benefit_composition_frozen_legacy_rank == belgium_family_benefits_child_benefit_one_child_count:
                              belgium_child_benefit_flanders_article_210_old_system_first_child_2025_monthly_amount
                          else:
                              if belgium_child_benefit_composition_frozen_legacy_rank == belgium_family_benefits_child_benefit_two_child_count:
                                  belgium_child_benefit_flanders_legacy_second_rank_2025_monthly_amount
                              else:
                                  belgium_child_benefit_flanders_legacy_third_plus_rank_2025_monthly_amount
                  else:
                      belgium_child_benefit_flanders_article_13_2025_base_monthly_amount
              else:
                  if belgium_family_benefits_transition_region == belgium_family_benefits_child_benefit_region_wallonia:
                      if belgium_family_benefits_transition_wallonia_legacy_lgaf_child_route_applies:
                          if belgium_child_benefit_composition_is_orphan or belgium_child_benefit_composition_is_full_orphan:
                              belgium_child_benefit_wallonia_legacy_orphan_2025_monthly_amount
                          else:
                              if belgium_child_benefit_composition_frozen_legacy_rank == belgium_family_benefits_child_benefit_one_child_count:
                                  belgium_child_benefit_wallonia_pre_2020_first_child_2025_base_monthly_amount
                              else:
                                  if belgium_child_benefit_composition_frozen_legacy_rank == belgium_family_benefits_child_benefit_two_child_count:
                                      belgium_child_benefit_wallonia_legacy_second_rank_2025_monthly_amount
                                  else:
