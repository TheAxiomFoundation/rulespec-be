              corpus_citation_path: "be-vlg/statute/decreet/2018/04/27/2018040369/article/210"
              excerpt: "Een rechtgevend kind dat geboren is vóór 1 januari 2019 en voor wie het recht op kinderbijslag overeenkomstig de kinderbijslagreglementering is geopend op 31 december 2018, blijft recht geven op kinderbijslag overeenkomstig de kinderbijslagreglementering"
