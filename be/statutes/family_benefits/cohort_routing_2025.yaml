format: rulespec/v1
imports:
  - be:statutes/family_benefits/child_benefit_base_2025#belgium_family_benefits_child_benefit_region_brussels
  - be:statutes/family_benefits/child_benefit_base_2025#belgium_family_benefits_child_benefit_region_flanders
  - be:statutes/family_benefits/child_benefit_base_2025#belgium_family_benefits_child_benefit_region_wallonia
  - be:statutes/family_benefits/child_benefit_base_2025#belgium_family_benefits_child_benefit_region_german_speaking_community
module:
  summary: |-
    This module routes a 2025 Belgian child-benefit case between the legacy
    LGAF amount surface and the regional amount surface. Flanders preserves
    the legacy amount only for a child born before 1 January 2019 whose right
    was open on 31 December 2018. Wallonia applies its preserved LGAF amounts
    to children born before 2020. Brussels and the German-speaking Community
    do not use a child-level legacy-cohort switch: each instead has a
    household-level protected-amount comparison. The Brussels birth-date
    reduction in Article 35 is exposed separately from its Article 39
    household protection.
  source_verification:
    corpus_citation_paths:
      - "be-vlg/statute/decreet/2018/04/27/2018040369/article/210"
      - "be-vlg/statute/decreet/2018/04/27/2018040369/article/13"
      - "be-wal/statute/decret/2018/02/08/2018201006/article/120"
      - "be-wal/statute/decret/2018/02/08/2018201006/article/136"
      - "be-wal/guidance/aviq/family-benefits/amount-scale-2025-02/page-1"
      - "be-wal/guidance/aviq/family-benefits/amount-scale-2025-02/page-4"
      - "be-bru/statute/ordonnance/2019/04/25/2019012118/article/35"
      - "be-bru/statute/ordonnance/2019/04/25/2019012118/article/39"
      - "be-dg/statute/moniteur/decret-2018-04-23/2018202523/family-benefits/block-1"
    upstream_source_check:
      status: official_parameter_source
      checked_paths:
        - "be-wal/statute/decret/2018/02/08/2018201006/article/120"
        - "be-wal/statute/decret/2018/02/08/2018201006/article/136"
      rationale: |-
        Article 120 preserves the LGAF provisions for children born no later
        than the day before the commencement date, and Article 136 delegates
        that date to the Government. The official AVIQ 2025 amount scale is
        therefore used only to resolve the delegated boundary as children
        born before 2020 versus children born from 2020.
  proof_validation:
    required: true
rules:
