            kind: formula
            source:
              corpus_citation_path: "be-dg/statute/moniteur/decret-2018-04-23/2018202523/family-benefits/block-1"
              excerpt: "Dieser Betrag wird anstelle der in den Artikeln 8, 17, 19, 23 und 25 erwähnten Leistungen gezahlt, bis eine der folgenden Situationen eintritt: 1. die Summe der in den Artikeln 8, 17, 19, 23 und 25 erwähnten Leistungen ist vorteilhafter als der in Absatz 1 erwähnte Betrag; 2. das Kindergeld wird nicht mehr für alle Kinder, die bei der Festlegung des in Absatz 1 erwähnten Betrags berücksichtigt wurden, an einen gemeinsamen Empfänger gezahlt."
