        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: "be-bru/statute/ordonnance/2019/04/25/2019012118/article/39"
              excerpt: "le paiement des allocations familiales restent d'application lorsque l'attributaire ou le demandeur générait le paiement d'un taux d'allocations familiales pour le mois de décembre 2019 qui, après application de l'article 76bis de la LGAF, permet l'octroi d'un montant supérieur à celui fixé par les articles 7 à 13"
