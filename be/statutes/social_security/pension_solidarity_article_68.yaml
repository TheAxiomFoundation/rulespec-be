format: rulespec/v1
imports:
  - be:statutes/social_security/non_labour_income_contributions#belgium_pension_solidarity_article_68_phase_in_rate
  - be:statutes/social_security/non_labour_income_contributions#belgium_pension_solidarity_article_68_mid_rate
  - be:statutes/social_security/non_labour_income_contributions#belgium_pension_solidarity_article_68_top_rate
module:
  summary: |-
    This legal-basis adapter exposes the Article 68 pension-solidarity band
    rates already encoded by non_labour_income_contributions and attaches the
    direct operative statutory proofs. It introduces no new numeric
    parameters; idempotent bounds preserve the imported canonical executable
    values.
    Indexed 2025 monetary thresholds remain owned and proved by the imported
    canonical module against the applicable pension-service tables.
  source_verification:
    corpus_citation_path: "be/statute/loi/1994/03/30/1994021117/article/68"
rules:
  - name: belgium_pension_article_68_solidarity_phase_in_rate
    kind: parameter
    dtype: Rate
    source: Law of 30 March 1994 on social provisions, article 68 section 2, phase-in rate used in the second and fourth solidarity-withholding bands
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: "be/statute/loi/1994/03/30/1994021117/article/68"
              excerpt: "Le montant de la retenue prévue à l'alinéa 1er est, selon la qualité du bénéficiaire, établi conformément au tableau ci-dessous :"
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: "be/statute/loi/1994/03/30/1994021117/article/68"
              excerpt: "(P - 1.711,72) x 50 %"
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: "be/statute/loi/1994/03/30/1994021117/article/68"
              excerpt: "28,44 + [(P - 1.895,87) x 50 %]"
    versions:
      - effective_from: '2019-03-01'
        formula: |-
          min(belgium_pension_solidarity_article_68_phase_in_rate, belgium_pension_solidarity_article_68_phase_in_rate)
  - name: belgium_pension_article_68_solidarity_mid_rate
    kind: parameter
    dtype: Rate
    source: Law of 30 March 1994 on social provisions, article 68 section 2, middle solidarity-withholding band rate
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: "be/statute/loi/1994/03/30/1994021117/article/68"
              excerpt: "P x 0,015"
    versions:
      - effective_from: '2019-03-01'
        formula: |-
          min(belgium_pension_solidarity_article_68_mid_rate, belgium_pension_solidarity_article_68_mid_rate)
  - name: belgium_pension_article_68_solidarity_top_rate
    kind: parameter
    dtype: Rate
    source: Law of 30 March 1994 on social provisions, article 68 section 2, top solidarity-withholding band rate
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: "be/statute/loi/1994/03/30/1994021117/article/68"
              excerpt: "P x 0,02"
    versions:
      - effective_from: '2019-03-01'
        formula: |-
          min(belgium_pension_solidarity_article_68_top_rate, belgium_pension_solidarity_article_68_top_rate)
