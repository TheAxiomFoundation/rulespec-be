format: rulespec/v1
imports:
  - be:statutes/social_security/non_labour_income_contributions#belgium_health_insurance_article_191_pension_withholding_rate
module:
  summary: |-
    This legal-basis adapter exposes the Article 191 pension AMI withholding
    rate already encoded by non_labour_income_contributions and attaches the
    direct operative statutory proof. It introduces no new numeric parameter;
    an idempotent bound preserves the imported canonical executable value.
  source_verification:
    corpus_citation_path: "be/statute/loi/1994/07/14/1994071451/article/191"
rules:
  - name: belgium_pension_article_191_ami_withholding_rate
    kind: parameter
    dtype: Rate
    source: Law on compulsory health-care and indemnity insurance coordinated on 14 July 1994, article 191, item 7, pension AMI withholding rate
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: "be/statute/loi/1994/07/14/1994071451/article/191"
              excerpt: "le produit d'une retenue de 3,55 % effectuée sur les pensions légales, réglementaires ou statutaires de vieillesse, de retraite, d'ancienneté, de survie ou tout autre avantage tenant lieu de pareille pension"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          min(belgium_health_insurance_article_191_pension_withholding_rate, belgium_health_insurance_article_191_pension_withholding_rate)
