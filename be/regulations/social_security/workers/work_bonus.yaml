format: rulespec/v1
module:
  summary: |-
    This module records the documentary parameters for the Belgium employee
    work-bonus reduction. It encodes the rounding rule from article 1 of the
    Royal Decree of 17 January 2000 and the January and February-onward 2025
    thresholds, maximum reductions, and alpha coefficients published in the
    official ONSS DmfA 2025/2 employee table. Monthly payroll inputs,
    performance fractions, manual-worker multipliers, restructuring
    reductions, vacation-pay carryover, special social-insurance categories,
    and employer-side calculations remain separate payroll surfaces.
  source_verification:
    corpus_citation_path: "be/statute/loi/1999/12/20/2000022052/article/2"
units:
  - name: EUR
    kind: currency
    minor_units: 2
rules:
  - name: belgium_worker_work_bonus_cent_rounding_multiple
    kind: parameter
    dtype: Decimal
    source: Royal Decree of 17 January 2000, article 1, rounds euro amounts to the second decimal with half cents rounded upward
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          0.01
